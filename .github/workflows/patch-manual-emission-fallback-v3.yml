name: Patch manual emission fallback v3

on:
  push:
    branches:
      - fix/manual-emission-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-emission-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply the reviewed targeted patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/patch-manual-emission-fallback-v2.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n      - name: Build"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/manual-emission-patch.py').write_text(script)
          PY
          python /tmp/manual-emission-patch.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-manual-emission-fallback.yml .github/workflows/patch-manual-emission-fallback-v2.yml .github/workflows/patch-manual-emission-fallback-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/saas/SaasEmission.tsx src/pages/SaasApp.tsx .github/workflows/patch-manual-emission-fallback.yml .github/workflows/patch-manual-emission-fallback-v2.yml .github/workflows/patch-manual-emission-fallback-v3.yml
          git commit -m "feat(saas): allow manual emission data without registry records"
          git push origin HEAD:fix/manual-emission-fallback
