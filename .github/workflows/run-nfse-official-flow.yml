name: Run NFS-e official flow patch
on:
  push:
    paths:
      - 'scripts/patch_nfse_official_flow.py'
      - '.github/workflows/run-nfse-official-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement escaping and patch emitter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_nfse_official_flow.py')
          s=p.read_text()
          s=s.replace('s, n = re.subn(pattern, repl, s, count=1, flags=re.S)', 's, n = re.subn(pattern, lambda _m: repl, s, count=1, flags=re.S)')
          p.write_text(s)
          PY
          python scripts/patch_nfse_official_flow.py
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - name: Commit patched emitter
        run: |
          git config user.name ws-fiscal-bot
          git config user.email ws-fiscal-bot@users.noreply.github.com
          git add src/components/saas/SaasEmission.tsx scripts/patch_nfse_official_flow.py
          git commit -m "feat: wire official four-step NFS-e form"
          git push
