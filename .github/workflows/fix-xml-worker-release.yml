name: Fix XML worker lease release

on:
  push:
    paths:
      - '.github/workflows/fix-xml-worker-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch release call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/fiscal-sales-xml-backfill/index.ts')
          s = p.read_text()
          old = 'await admin.rpc("release_fiscal_sales_worker_lease",{p_company_id:company.id,p_worker:"xml"}).catch(()=>{});'
          new = 'try{await admin.rpc("release_fiscal_sales_worker_lease",{p_company_id:company.id,p_worker:"xml"});}catch{}'
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit('Expected release call not found')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/fiscal-sales-xml-backfill/index.ts
          git commit -m 'fix: release XML backfill lease safely'
          git push
