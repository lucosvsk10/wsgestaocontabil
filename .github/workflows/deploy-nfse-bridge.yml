name: Deploy generic NFS-e bridge

on:
  push:
    paths:
      - 'infra/ws-nfse-sefin-probe/**'
      - '.github/workflows/deploy-nfse-bridge.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TOKEN_A: ${{ secrets.VERCEL_TOKEN }}
      TOKEN_B: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Vercel token
        id: token
        run: |
          TOKEN="${TOKEN_A:-${TOKEN_B:-}}"
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy skipped: configure VERCEL_TOKEN or VERCEL_ACCESS_TOKEN in repository Actions secrets."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Deploy existing ws-nfse-sefin-probe project
        if: steps.token.outputs.available == 'true'
        run: |
          npx --yes vercel@latest deploy --prod --yes --cwd infra/ws-nfse-sefin-probe --token "$VERCEL_TOKEN"
