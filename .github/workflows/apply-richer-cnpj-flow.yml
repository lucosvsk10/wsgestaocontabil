name: Apply richer CNPJ registry flow

on:
  push:
    paths:
      - '.github/workflows/apply-richer-cnpj-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply richer CNPJ flow
        run: python .github/scripts/apply_richer_cnpj.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/saas/SaasCadastros.tsx src/components/saas/SaasCnpjLookup.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(saas): surface richer official CNPJ data"
          git push
