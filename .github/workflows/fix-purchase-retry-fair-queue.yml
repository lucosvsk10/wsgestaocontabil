name: Fix purchase retry fair queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-purchase-retry-fair-queue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch purchase XML retry queue
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fiscal-purchases-xml-backfill/index.ts')
          s=p.read_text()
          old='retryBefore=new Date(Date.now()-6*3600000).toISOString()'
          new='retryBefore=new Date(Date.now()-10*60000).toISOString()'
          if old not in s:
              raise SystemExit('retry cooldown marker not found')
          s=s.replace(old,new,1)
          old2='const {data,error}=await q.order("issue_date",{ascending:false}).order("note_number",{ascending:false}).limit(Math.max(batch*3,batch-rows.length));'
          new2='const {data,error}=await (phase==="retry"?q.order("updated_at",{ascending:true}).order("issue_date",{ascending:false}):q.order("issue_date",{ascending:false}).order("note_number",{ascending:false})).limit(Math.max(batch*3,batch-rows.length));'
          if old2 not in s:
              raise SystemExit('queue order marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ws-fiscal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/fiscal-purchases-xml-backfill/index.ts
          git commit -m "fix: make purchase XML retry queue fair"
          git push
