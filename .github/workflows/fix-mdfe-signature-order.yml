name: Fix MDFe signature order

on:
  push:
    paths:
      - '.github/workflows/fix-mdfe-signature-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch MDF-e signature order
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          old='s.computeSignature(xml,{location:{reference:"//*[local-name(.)=\'infMDFe\']",action:"after"}});return s.getSignedXml()}'
          new='s.computeSignature(xml,{location:{reference:"//*[local-name(.)=\'infMDFe\']",action:"after"}});let signed=s.getSignedXml();const supl=signed.match(/<infMDFeSupl>[\\s\\S]*?<\\/infMDFeSupl>/)?.[0]||"";if(supl){signed=signed.replace(supl,"");const end=signed.indexOf("</Signature>");if(end<0)throw new Error("Assinatura MDF-e não encontrada após assinatura XML");const pos=end+"</Signature>".length;signed=signed.slice(0,pos)+supl+signed.slice(pos)}const iInf=signed.indexOf("<infMDFe "),iSig=signed.indexOf("<Signature"),iSupl=signed.indexOf("<infMDFeSupl>");if(iInf<0||iSig<iInf||iSupl<iSig)throw new Error("Ordem XML MDF-e inválida: esperado infMDFe, Signature, infMDFeSupl");return signed}'
          if old not in s:
              raise SystemExit('sign function target not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit patch
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts
          git commit -m 'fix: enforce MDF-e signature before supplemental QR block'
          git push
