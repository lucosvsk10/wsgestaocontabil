name: Apply SaaS NBS and NFS-e numbering patch

on:
  push:
    paths:
      - '.github/workflows/apply-nbs-numbering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SaaS fiscal UI
        run: |
          python <<'PY'
          from pathlib import Path

          cad = Path('src/components/saas/SaasCadastros.tsx')
          text = cad.read_text()
          old = '''            <Field label="Código da NBS" value={formatNbs(form.nbs_code)} onChange={value => set('nbs_code', value)} required hint="Obrigatório para emissão oficial da NFS-e. Ex.: 1.1404.43.00" />'''
          new = '''            <FiscalCodeField kind="nbs" label="Código da NBS" value={form.nbs_code} onChange={value => set('nbs_code', value)} required />'''
          if old not in text:
              raise SystemExit('NBS field not found in SaasCadastros.tsx')
          cad.write_text(text.replace(old, new, 1))

          em = Path('src/components/saas/SaasEmission.tsx')
          text = em.read_text()
          old = '''          <Field label="Código da NBS" value={form.nbsCode} onChange={v => set('nbsCode', v)} required placeholder="1.1404.43.00" hint="Obrigatório para emissão oficial da NFS-e." />'''
          new = '''          <FiscalCodeField kind="nbs" label="Código da NBS" value={form.nbsCode} onChange={v => set('nbsCode', v)} required />'''
          if old not in text:
              raise SystemExit('NBS field not found in SaasEmission.tsx')
          text = text.replace(old, new, 1)

          marker = '''    const pp = p.data;\n    const savedDraft = draftKey ? readEmissionDraft(draftKey) : null;'''
          replacement = '''    const pp = p.data;\n    const savedDraft = draftKey ? readEmissionDraft(draftKey) : null;\n    let nfseSuggestedSeries = String(pp?.series_nfse || '1');\n    let nfseSuggestedNumber = Number(pp?.next_number_nfse || 1);\n    if (documentType === 'NFS-e' && !savedDraft) {\n      const { data: latestNfse } = await (supabase as any)\n        .from('saas_fiscal_emissions')\n        .select('series,number,authorized_at,created_at')\n        .eq('organization_id', organizationId)\n        .eq('document_type', 'nfse')\n        .eq('status', 'authorized')\n        .order('authorized_at', { ascending: false, nullsFirst: false })\n        .order('created_at', { ascending: false })\n        .limit(1)\n        .maybeSingle();\n      if (latestNfse) {\n        const lastNumber = Number(String(latestNfse.number || '').replace(/\\D/g, ''));\n        if (Number.isFinite(lastNumber) && lastNumber > 0)\n          nfseSuggestedNumber = Math.max(nfseSuggestedNumber, lastNumber + 1);\n        if (String(latestNfse.series || '').trim()) nfseSuggestedSeries = String(latestNfse.series);\n      }\n    }'''
          if marker not in text:
              raise SystemExit('load marker not found in SaasEmission.tsx')
          text = text.replace(marker, replacement, 1)

          old_series = '''            : documentType === 'NFS-e'\n            ? pp.series_nfse || '1'\n            : documentType === 'CT-e' '''
          new_series = '''            : documentType === 'NFS-e'\n            ? nfseSuggestedSeries\n            : documentType === 'CT-e' '''
          if old_series not in text:
              raise SystemExit('series default block not found')
          text = text.replace(old_series, new_series, 1)

          old_number = '''            : documentType === 'NFS-e'\n            ? pp.next_number_nfse || 1\n            : documentType === 'CT-e' '''
          new_number = '''            : documentType === 'NFS-e'\n            ? nfseSuggestedNumber || 1\n            : documentType === 'CT-e' '''
          if old_number not in text:
              raise SystemExit('number default block not found')
          text = text.replace(old_number, new_number, 1)
          em.write_text(text)
          PY

      - name: Build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Commit changes
        run: |
          git config user.name "ws-fiscal-bot"
          git config user.email "ws-fiscal-bot@users.noreply.github.com"
          git add src/components/saas/SaasCadastros.tsx src/components/saas/SaasEmission.tsx
          git commit -m "feat: make NBS searchable and continue NFS-e numbering"
          git push
