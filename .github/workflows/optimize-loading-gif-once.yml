name: Optimize loading GIF once

on:
  push:
    paths:
      - '.github/workflows/optimize-loading-gif-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize original loading animation without changing motion
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageSequence

          for name in ('ws-loading-light.gif', 'ws-loading-standard.gif'):
              path = Path('public/loading') / name
              im = Image.open(path)
              frames = []
              durations = []
              for frame in ImageSequence.Iterator(im):
                  rgba = frame.convert('RGBA').resize((960, 540), Image.Resampling.LANCZOS)
                  # Same central region that the UI already displayed, with a small safety margin.
                  cropped = rgba.crop((414, 234, 554, 330))
                  frames.append(cropped)
                  durations.append(frame.info.get('duration', im.info.get('duration', 30)))
              frames[0].save(
                  path,
                  save_all=True,
                  append_images=frames[1:],
                  duration=durations,
                  loop=0,
                  disposal=2,
                  optimize=True,
              )
              check = Image.open(path)
              print(name, check.size, getattr(check, 'n_frames', 1), path.stat().st_size)
          PY

      - name: Update loading component and preload assets
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/AppLoadingScreen.tsx')
          s = p.read_text()
          s = s.replace('''        className="ws-app-loader-source"\n        draggable={false}\n        decoding="async"''', '''        className="ws-app-loader-source"\n        draggable={false}\n        loading="eager"\n        fetchPriority="high"\n        decoding="sync"''')

          s = re.sub(r'''        \.ws-app-loading-indicator \{\n          position: absolute;\n          top: 52\.5%;\n          left: 50%;\n          transform: translate\(-50%, -50%\);\n          display: flex;\n          flex-direction: column;\n          align-items: center;\n          gap: 5px;\n          min-width: 120px;\n        \}''', '''        .ws-app-loading-indicator {\n          position: absolute;\n          top: 52.5%;\n          left: 50%;\n          transform: translate(-50%, -50%);\n          display: flex;\n          flex-direction: column;\n          align-items: center;\n          gap: 0;\n          min-width: 120px;\n        }''', s)

          s = re.sub(r'''        \.ws-app-loader-crop \{.*?        \}\n\n        \.ws-app-loader-source \{.*?        \}''', '''        .ws-app-loader-crop {\n          position: relative;\n          display: grid;\n          place-items: center;\n          width: 112px;\n          height: 77px;\n          overflow: hidden;\n          isolation: isolate;\n          -webkit-mask-image: radial-gradient(ellipse at center, #000 64%, rgba(0,0,0,.97) 76%, transparent 100%);\n          mask-image: radial-gradient(ellipse at center, #000 64%, rgba(0,0,0,.97) 76%, transparent 100%);\n        }\n\n        .ws-app-loader-source {\n          position: static;\n          display: block;\n          width: 112px;\n          height: auto;\n          max-width: none;\n          pointer-events: none;\n          user-select: none;\n        }''', s, flags=re.S)

          s = s.replace('''          opacity: .9;\n        }''', '''          opacity: .9;\n          margin-top: 18px;\n        }''', 1)

          s = re.sub(r'''          \.ws-app-loading-indicator \{\n            top: 53\.5%;\n            gap: 4px;\n          \}\n\n          \.ws-app-loader-crop \{\n            width: 94px;\n            height: 56px;\n          \}\n\n          \.ws-app-loader-source \{\n            width: 864px;\n            height: 486px;\n            left: -385px;\n            top: -226px;\n          \}''', '''          .ws-app-loading-indicator {\n            top: 53.5%;\n            gap: 0;\n          }\n\n          .ws-app-loader-crop {\n            width: 96px;\n            height: 66px;\n          }\n\n          .ws-app-loader-source {\n            width: 96px;\n          }''', s)
          s = s.replace('''          .ws-app-loading-label {\n            font-size: 9px;\n          }''', '''          .ws-app-loading-label {\n            font-size: 9px;\n            margin-top: 15px;\n          }''')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          preload = '''    <link rel="preload" as="image" href="/loading/ws-loading-light.gif" type="image/gif" fetchpriority="high" />\n    <link rel="preload" as="image" href="/loading/ws-loading-standard.gif" type="image/gif" fetchpriority="high" />\n'''
          if '/loading/ws-loading-light.gif' not in s:
              s = s.replace('    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />\n', '    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />\n' + preload)
          p.write_text(s)
          PY

      - name: Remove staging leftovers and this one-shot workflow
        run: |
          rm -f public/loading/.placeholder \
                public/loading/PLEASE_IGNORE \
                public/loading/README.tmp \
                public/loading/STOP \
                public/loading/ws-loader-mark.gif \
                public/loading/ws-loader-mark-optimized.gif \
                .github/workflows/optimize-loading-gif-once.yml

      - name: Commit optimized loading screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): preload and optimize original loading GIF"
          git push
