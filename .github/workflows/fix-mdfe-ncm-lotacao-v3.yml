name: Fix MDFe NCM lotacao

on:
  push:
    paths:
      - '.github/workflows/fix-mdfe-ncm-lotacao-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch MDF-e NCM
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          old='prodPredXml=needsProd?`<prodPred><tpCarga>${esc(raw.tpCarga||"05")}</tpCarga><xProd>${esc(raw.xProd||"CARGA GERAL")}</xProd>${lotacaoXml}</prodPred>`:""'
          new='ncmPred=digits(raw.ncmPredominante||(tpAmb==="2"?"94036000":"")),prodPredXml=needsProd?`<prodPred><tpCarga>${esc(raw.tpCarga||"05")}</tpCarga><xProd>${esc(raw.xProd||"CARGA GERAL")}</xProd>${ncmPred?`<NCM>${ncmPred}</NCM>`:""}${lotacaoXml}</prodPred>`:""'
          if old not in s:
              raise SystemExit('prodPred target not found')
          s=s.replace(old,new,1)
          marker='if(!String(raw.placa||"").trim())errors.push'
          if marker in s and 'NCM do produto predominante' not in s:
              insert='if((String(raw.tpEmit||"1")==="1"||String(raw.tpEmit||"1")==="3")&&production&&digits(raw.ncmPredominante).length!==8)errors.push("NCM do produto predominante obrigatório para carga lotação");'
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts
          git commit -m 'fix: include NCM in MDF-e lotation product'
          git push
