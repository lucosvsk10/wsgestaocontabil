name: Mount registry importer
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saas-registry-import
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/mount-saas-registry-import.cjs
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/saas/SaasCadastros.tsx
          git diff --cached --quiet || git commit -m "feat(saas): expose destination-aware registry import"
          git push origin HEAD:feat/saas-registry-import
