name: Fiscal sales probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fiscal-sales-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe-purchases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PKCS12 transport
        run: python3 -m pip install --quiet requests-pkcs12
      - name: Probe pending NF-e by key
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, gzip, base64, requests
          from requests_pkcs12 import post
          SUPABASE='https://nadtoitgkukzbghtbohm.supabase.co/functions/v1/github-fiscal-runner'
          KEYS=['26260851629276000174550010000030931000034960','26260851629276000174550010000030971000035000','31260803692395000129550010002247741082643543','35260815806937000126550000000314461869724694','35260815806937000126550000000315411825450652','35260815806937000126550000000315551451435418','35260832302352000198550010000216471616332794']
          oidc_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in oidc_url else '?'
          rr=requests.get(oidc_url+sep+'audience=ws-fiscal-runner',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},timeout=20); rr.raise_for_status()
          h={'Authorization':'Bearer '+rr.json()['value'],'content-type':'application/json'}
          lease=requests.post(SUPABASE,headers=h,json={'mode':'lease'},timeout=30); lease.raise_for_status(); sec=lease.json()
          pfx=base64.b64decode(sec['pfx_base64']); pwd=sec['password']; cnpj=sec['cnpj']
          out=[]
          for ch in KEYS:
              soap=f'''<?xml version="1.0" encoding="utf-8"?><soap12:Envelope xmlns:soap12="http://www.w3.org/2003/05/soap-envelope"><soap12:Body><nfeDistDFeInteresse xmlns="http://www.portalfiscal.inf.br/nfe/wsdl/NFeDistribuicaoDFe"><nfeDadosMsg><distDFeInt xmlns="http://www.portalfiscal.inf.br/nfe" versao="1.01"><tpAmb>1</tpAmb><cUFAutor>27</cUFAutor><CNPJ>{cnpj}</CNPJ><consChNFe><chNFe>{ch}</chNFe></consChNFe></distDFeInt></nfeDadosMsg></nfeDistDFeInteresse></soap12:Body></soap12:Envelope>'''
              try:
                  r=post('https://www1.nfe.fazenda.gov.br/NFeDistribuicaoDFe/NFeDistribuicaoDFe.asmx',data=soap.encode(),headers={'Content-Type':'application/soap+xml; charset=utf-8','Accept':'application/soap+xml,text/xml,*/*'},pkcs12_data=pfx,pkcs12_password=pwd,timeout=35)
                  text=r.text
                  cstat=(re.search(r'<cStat>([^<]+)</cStat>',text) or [None,''])[1]
                  mot=(re.search(r'<xMotivo>([^<]+)</xMotivo>',text) or [None,''])[1]
                  schemas=[]; full=False
                  for schema,b64 in re.findall(r'<docZip[^>]*schema=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</docZip>',text,re.I):
                      try: x=gzip.decompress(base64.b64decode(''.join(b64.split()))).decode('utf-8','replace')
                      except Exception: continue
                      schemas.append(schema); full=full or bool(re.search(r'<(?:nfeProc|procNFe|NFe)\b',x,re.I))
                  out.append({'key':ch,'http':r.status_code,'cStat':cstat,'xMotivo':mot,'schemas':schemas,'full':full})
              except Exception as e:
                  out.append({'key':ch,'error':str(e)[:180]})
          print(json.dumps(out,ensure_ascii=False))
          PY
