name: Fiscal sales probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fiscal-sales-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  backfill-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose remaining NFe route
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,json,requests
          SUPABASE='https://nadtoitgkukzbghtbohm.supabase.co/functions/v1/github-fiscal-runner'
          DOWNLOAD='https://ws-svrs-consit.vercel.app/api/download'
          KEY='27260829880800000126550020000029771000079319'
          oidc_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in oidc_url else '?'
          rr=requests.get(oidc_url+sep+'audience=ws-fiscal-runner',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},timeout=20); rr.raise_for_status()
          oidc=rr.json()['value']; h={'Authorization':'Bearer '+oidc,'content-type':'application/json'}
          lease=requests.post(SUPABASE,headers=h,json={'mode':'lease'},timeout=30); lease.raise_for_status(); sec=lease.json()
          r=requests.post(DOWNLOAD,json={'certificate_base64':sec['pfx_base64'],'certificate_password':sec['password'],'access_key':KEY},timeout=30)
          try:o=r.json()
          except Exception:o={}
          html=str(o.get('body_text') or o.get('body') or '')
          jm=re.search(r'var\s+stringJson\s*=\s*(\{[\s\S]*?\})\s*;',html)
          visible=' | '.join(' '.join(re.sub(r'<[^>]+>',' ',x).split()) for x in re.findall(r'<h4[^>]*textoErro[^>]*>([\s\S]*?)</h4>',html,re.I))
          bridge_error=str(o.get('error') or o.get('message') or '')[:1200]
          motivo=(bridge_error or visible or 'no_visible_error')[:1000]
          raw=json.dumps({'http':r.status_code,'json_keys':list(o.keys())[:20],'bridge_error':bridge_error,'len':len(html),'has_stringJson':bool(jm),'has_nfe':bool(re.search(r'<(?:nfeProc|procNFe|NFe)\b',html,re.I))},ensure_ascii=False)
          payload={'mode':'result','results':[{'note_number':2977,'synthetic_key':KEY,'cstat':'DIAG2','xmotivo':motivo,'real_key':KEY,'raw_response':raw}]}
          z=requests.post(SUPABASE,headers=h,json=payload,timeout=30); z.raise_for_status(); print(z.text)
          PY