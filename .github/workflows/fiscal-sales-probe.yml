name: Fiscal sales probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fiscal-sales-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  backfill-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe older NFC-e range and send results
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, requests, time
          SUPABASE='https://nadtoitgkukzbghtbohm.supabase.co/functions/v1/github-fiscal-runner'
          BRIDGE='https://ws-svrs-consit.vercel.app/api/consit'
          DOWNLOAD='https://ws-svrs-consit.vercel.app/api/download'
          oidc_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in oidc_url else '?'
          rr=requests.get(oidc_url+sep+'audience=ws-fiscal-runner',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},timeout=20)
          rr.raise_for_status()
          oidc=rr.json()['value']
          h={'Authorization':'Bearer '+oidc,'content-type':'application/json'}
          lease=requests.post(SUPABASE,headers=h,json={'mode':'lease'},timeout=30)
          lease.raise_for_status()
          sec=lease.json()
          pfx=sec['pfx_base64']; password=sec['password']
          cnpj=sec['cnpj']
          months=['2607','2606']
          results=[]
          for m in months:
              for n in range(999,899,-1):
                  payload={'certificate_base64':pfx,'certificate_password':password,'cnpj':cnpj,'month':m,'series':'001','note_number':n}
                  try:
                      r=requests.post(BRIDGE,json=payload,timeout=20)
                      o=r.json()
                  except Exception:
                      continue
                  cstat=str(o.get('cstat') or '')
                  xmotivo=str(o.get('xmotivo') or '')
                  real_key=str(o.get('real_key') or '')
                  synt=str(o.get('synthetic_key') or '')
                  raw=str(o.get('body_text') or '')[:8000]
                  if cstat in ('100','101','110','150') or (real_key and len(real_key)==44):
                      if real_key and len(real_key)==44:
                          try:
                              dr=requests.post(DOWNLOAD,json={'certificate_base64':pfx,'certificate_password':password,'access_key':real_key},timeout=20)
                              dj=dr.json()
                              raw=json.dumps(dj,ensure_ascii=False)[:30000]
                          except Exception:
                              pass
                      results.append({'note_number':n,'synthetic_key':synt,'cstat':cstat,'xmotivo':xmotivo,'real_key':real_key,'raw_response':raw})
                  time.sleep(.12)
          if results:
              z=requests.post(SUPABASE,headers=h,json={'mode':'sales_result','results':results},timeout=60)
              z.raise_for_status()
              requests.post(SUPABASE,headers=h,json={'mode':'result','results':results},timeout=60).raise_for_status()
          print(json.dumps({'found':len(results),'notes':[x['note_number'] for x in results[:15]]}))
          PY