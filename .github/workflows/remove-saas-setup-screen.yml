name: Remove SaaS setup screen
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-saas-setup-screen.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable setup screen
        run: >-
          python -c "from pathlib import Path; p=Path('src/pages/SaasApp.tsx'); s=p.read_text(); old=\"  const showSetup =\\n    active === 'Início' && Boolean(organization?.id) && !setupComplete && !setupDismissed;\"; assert old in s; p.write_text(s.replace(old, '  const showSetup = false;'))"
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SaasApp.tsx
          git commit -m 'fix(saas): remove mandatory setup screen'
          git push
