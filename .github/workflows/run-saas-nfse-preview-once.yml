name: Run SaaS NFS-e preview once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-saas-nfse-preview-once.yml'
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=urn%3Aws-nfse-preview" | jq -r .value)
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Invoke Supabase SaaS preview
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          code=$(curl -sS -o preview.json -w "%{http_code}" -H "Authorization: Bearer $OIDC_TOKEN" "https://nadtoitgkukzbghtbohm.supabase.co/functions/v1/saas-nfse-raizemtec-preview-prepare-once")
          echo "Supabase preview HTTP $code"
          test "$code" = "200"
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: raizemtec-nfse-preview
          path: preview.json
          retention-days: 1
# one-time artifact trigger
