name: Fix SaaS issued notes visual

on:
  push:
    paths:
      - '.github/workflows/fix-saas-issued-notes-visual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force transparent controls and zebra rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/saas/SaasIssuedNotes.tsx')
          s=p.read_text()

          old=''' return <div className="w-full space-y-3 text-[#0f172a]">'''
          new=''' return <div className="saas-issued-notes w-full space-y-3 text-[#0f172a]">\n  <style>{`\n   .saas-issued-notes button { background-color: transparent !important; color: #334155 !important; }\n   .saas-issued-notes button:hover:not(:disabled) { background-color: #f8fafc !important; }\n   .saas-issued-notes tbody tr:nth-child(odd) { background-color: #ffffff !important; }\n   .saas-issued-notes tbody tr:nth-child(even) { background-color: #eef2f6 !important; }\n   .saas-issued-notes tbody tr:hover { background-color: #e6eef5 !important; }\n  `}</style>'''
          if old not in s: raise SystemExit('wrapper not found')
          s=s.replace(old,new,1)

          # Ensure primary page button also transparent even against global SaaS button rules.
          s=s.replace('''className="h-10 rounded-lg border border-[#d9e0e8] bg-white px-4 text-sm font-semibold text-[#0f172a] shadow-sm transition hover:bg-[#f8fafc]"''','''className="h-10 rounded-lg border border-[#d9e0e8] !bg-transparent px-4 text-sm font-semibold !text-[#334155] shadow-sm transition hover:!bg-[#f8fafc]"''',1)

          # Give actions enough space; compact the other columns slightly.
          old_cols='''<colgroup><col className="w-[13%]"/><col className="w-[23%]"/><col className="w-[24%]"/><col className="w-[22%]"/><col className="w-[10%]"/><col className="w-[8%]"/></colgroup>'''
          new_cols='''<colgroup><col className="w-[12%]"/><col className="w-[22%]"/><col className="w-[22%]"/><col className="w-[18%]"/><col className="w-[12%]"/><col className="w-[14%]"/></colgroup>'''
          if old_cols not in s: raise SystemExit('colgroup not found')
          s=s.replace(old_cols,new_cols,1)

          # Inline row color as a second layer of protection against global table styling.
          old_row='''return <tr key={item.id||index} onClick={()=>openPreview(item)} className={`cursor-pointer border-b border-[#edf0f3] transition-colors ${index%2===0?"bg-white":"bg-[#f2f5f8]"} hover:bg-[#eaf1f6]`}>'''
          new_row='''return <tr key={item.id||index} onClick={()=>openPreview(item)} style={{backgroundColor:index%2===0?"#ffffff":"#eef2f6"}} className="cursor-pointer border-b border-[#dfe5eb] transition-colors">'''
          if old_row not in s: raise SystemExit('row not found')
          s=s.replace(old_row,new_row,1)

          # Keep action controls on one line and make both outlined/transparent.
          old_actions='''<td className="px-4 py-3.5 align-middle" onClick={e=>e.stopPropagation()}><div className="flex justify-end gap-1"><button onClick={()=>openPreview(item)} className="inline-flex items-center gap-1 rounded-lg px-2 py-1.5 text-xs font-semibold text-[#334155] hover:bg-[#eef3f8]"><FileText className="h-3.5 w-3.5"/>Visualizar</button>{item.xml&&<button onClick={()=>downloadXml(item)} className="rounded-lg px-2 py-1.5 text-[10px] font-semibold text-[#334155] hover:bg-[#eef3f8]">XML</button>}</div></td>'''
          new_actions='''<td className="px-3 py-3.5 align-middle" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-end gap-2 whitespace-nowrap"><button onClick={()=>openPreview(item)} className="inline-flex h-8 items-center gap-1 rounded-lg border border-[#d9e0e8] !bg-transparent px-2.5 text-[11px] font-semibold !text-[#334155] hover:!bg-[#f8fafc]"><FileText className="h-3.5 w-3.5"/>Visualizar</button>{item.xml&&<button onClick={()=>downloadXml(item)} className="h-8 rounded-lg border border-[#d9e0e8] !bg-transparent px-2.5 text-[10px] font-semibold !text-[#334155] hover:!bg-[#f8fafc]">XML</button>}</div></td>'''
          if old_actions not in s: raise SystemExit('actions not found')
          s=s.replace(old_actions,new_actions,1)

          # Explicitly force visible page controls transparent.
          s=s.replace('''bg-transparent px-3 text-sm font-semibold''','''!bg-transparent px-3 text-sm font-semibold''')
          s=s.replace('''bg-transparent px-4 text-xs font-semibold''','''!bg-transparent px-4 text-xs font-semibold''')
          s=s.replace('''border px-3 py-1.5 text-xs font-semibold transition''','''border !bg-transparent px-3 py-1.5 text-xs font-semibold transition''')

          p.write_text(s)
          PY
      - name: Commit SaaS-only fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-saas-issued-notes-visual.yml
          git add src/components/saas/SaasIssuedNotes.tsx .github/workflows/fix-saas-issued-notes-visual.yml
          git commit -m "fix(saas): force transparent controls and zebra rows"
          git push
