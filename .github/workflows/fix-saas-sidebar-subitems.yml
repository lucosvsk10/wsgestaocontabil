name: Fix SaaS sidebar subitems
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-saas-sidebar-subitems.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply sidebar subitem visual fix
        shell: bash
        run: |
          cat > src/styles/saas-sidebar-subitems-fix.css <<'CSS'
          /* Final SaaS sidebar subitem reconciliation */
          .saas-admin-light .saas-nav-children {
            border-left: 1px solid #c7cdd3 !important;
            background: transparent !important;
          }

          .saas-admin-light .saas-nav-children .saas-nav-subitem,
          .saas-admin-light .saas-nav-children .saas-nav-subitem.is-active {
            background: transparent !important;
            border-left: 0 !important;
            border-right: 0 !important;
            border-top: 0 !important;
            border-bottom: 0 !important;
            box-shadow: none !important;
            border-radius: 0 !important;
          }

          .saas-admin-light .saas-nav-children .saas-nav-subitem:hover,
          .saas-admin-light .saas-nav-children .saas-nav-subitem.is-active:hover {
            background: #e1e5e9 !important;
          }

          .saas-admin-light .saas-nav-children .saas-nav-subitem.is-active {
            color: #111827 !important;
            font-weight: 500 !important;
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SaasApp.tsx')
          s=p.read_text()
          imp='import "@/styles/saas-sidebar-subitems-fix.css";'
          if imp not in s:
              marker='import "@/styles/saas-admin-reconciliation.css";'
              s=s.replace(marker, marker+'\n'+imp, 1)
          p.write_text(s)
          PY
      - name: Validate build
        run: npm install --legacy-peer-deps && npm run build
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name ws-ui-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-saas-sidebar-subitems.yml
          git add src/pages/SaasApp.tsx src/styles/saas-sidebar-subitems-fix.css package-lock.json package.json
          git diff --cached --quiet || (git commit -m 'fix(saas): clean sidebar subitems and connector line' && git push)
