name: Validate

# CI gate for accounting changes.
on:
  push:
    branches:
      - main
      - "fix/**"
      - "validate/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Accounting regressions
        run: npx -y vitest@3.1.1 run --environment node src/lib/lancamentos/payrollWorkbook.test.ts src/lib/lancamentos/historicalRegression.test.ts

      - name: Lint accounting files
        run: >-
          npx eslint
          src/App.tsx
          src/contexts/AccountingProcessingContext.tsx
          src/components/admin/lancamentos/LancamentosWorkspace.tsx
          src/components/admin/lancamentos/FolhaWorkspace.tsx
          src/components/admin/lancamentos/ComprasWorkspace.tsx
          src/components/admin/lancamentos/FaturamentoWorkspace.tsx
          src/components/admin/lancamentos/AccountingWorkflowUI.tsx
          src/components/admin/lancamentos/WrongCompetenceImportDialog.tsx
          src/components/admin/lancamentos/WrongCompetenceImportGuard.tsx
          src/components/admin/lancamentos/RevenueImportSummaryDialog.tsx
          src/lib/lancamentos/payrollWorkbook.ts
          src/lib/lancamentos/payrollWorkbook.test.ts
          src/lib/lancamentos/purchaseWorkbook.ts
          src/lib/lancamentos/revenueWorkbook.ts
          src/lib/lancamentos/revenueBatch.ts
          src/lib/lancamentos/processRevenueBatch.ts
          src/lib/lancamentos/workspaceStorage.ts
          src/lib/lancamentos/historicalRegression.ts
          src/lib/lancamentos/historicalRegression.test.ts
          src/lib/lancamentos/accountingExportWorkbook.ts
