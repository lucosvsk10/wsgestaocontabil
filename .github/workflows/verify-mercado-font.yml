name: Verify extractor company context
on:
  push:
    branches: [verify/extractor-ux-round2]
    paths: [.github/workflows/verify-mercado-font.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify production company context and reports
        run: |
          cat > /tmp/pw/verify.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
            let response;
            for(let attempt=1;attempt<=6;attempt++){
              response=await page.goto('https://wsgestaocontabil.lovable.app/extrator-preview',{waitUntil:'networkidle',timeout:90000});
              await page.waitForTimeout(5000);
              const ready=await page.locator('.extractor-company-picker-trigger').count();
              console.log('ATTEMPT',attempt,'HTTP',response?.status(),'URL',page.url(),'PICKER',ready);
              if(ready) break;
              await page.waitForTimeout(10000);
            }
            if(response?.status()!==200) throw new Error(`Unexpected HTTP ${response?.status()}`);
            const base=await page.evaluate(()=>({
              font:getComputedStyle(document.querySelector('.extractor-app')).fontFamily,
              picker:document.querySelector('.extractor-company-picker-trigger')?.innerText||'',
              profile:Boolean(document.querySelector('.extractor-account'))
            }));
            console.log('BASE',JSON.stringify(base));
            if(!/Space Grotesk/i.test(base.font)) throw new Error('Exact ADM font not active');
            if(!/EMPRESA DEMONSTRAÇÃO LTDA/.test(base.picker)) throw new Error('Legal name missing from navbar selector');
            if(!/Empresa demonstração/.test(base.picker)) throw new Error('Trade name missing from navbar selector');
            if(!/00\.000\.000\/0000-00/.test(base.picker)) throw new Error('CNPJ missing from navbar selector');
            await page.locator('.extractor-company-picker-trigger').click();
            if(!(await page.locator('.extractor-company-picker-menu').isVisible())) throw new Error('Company selector menu did not open');
            await page.keyboard.press('Escape');
            await page.getByRole('button',{name:'Relatórios',exact:true}).click();
            await page.waitForTimeout(1200);
            const report=await page.evaluate(()=>({
              rich:Boolean(document.querySelector('.extractor-report-rich')),
              company:(document.querySelector('.extractor-report-company')?.textContent||'').replace(/\s+/g,' ').trim(),
              metrics:document.querySelectorAll('.extractor-report-kpis .extractor-metric').length,
              panels:[...document.querySelectorAll('.extractor-report-rich .extractor-panel-head h2')].map(x=>x.textContent?.trim()).filter(Boolean),
              font:getComputedStyle(document.querySelector('.extractor-report-rich')).fontFamily
            }));
            console.log('REPORT',JSON.stringify(report));
            if(!report.rich) throw new Error('Rich reports page missing');
            if(report.metrics<6) throw new Error(`Expected 6 report metrics, got ${report.metrics}`);
            for(const title of ['Movimento no período','Documentos por modelo','Situação fiscal','Principais fornecedores','Cobertura XML']){
              if(!report.panels.includes(title)) throw new Error(`Missing report panel: ${title}`);
            }
            if(!/EMPRESA DEMONSTRAÇÃO LTDA/.test(report.company)||!/00\.000\.000\/0000-00/.test(report.company)) throw new Error('Active company context missing in reports');
            if(!/Space Grotesk/i.test(report.font)) throw new Error('Report typography diverged from ADM');
            await page.screenshot({path:'/tmp/extractor-final-company-reports.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pw/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extractor-final-company-reports
          path: /tmp/extractor-final-company-reports.png
          retention-days: 1
