name: Verify Mercado Pago font
on:
  push:
    branches: [verify/extractor-ux-round2]
    paths: [.github/workflows/verify-mercado-font.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify production font
        run: |
          cat > /tmp/pw/font.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1500,height:900}});
            const r=await page.goto('https://wsgestaocontabil.lovable.app/extrator-preview',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(5000);
            const font=await page.evaluate(()=>getComputedStyle(document.querySelector('.extractor-app')).fontFamily);
            console.log('HTTP',r?.status(),'URL',page.url(),'FONT',font);
            if(/Prompt/i.test(font)) throw new Error('Prompt is still active');
            if(!/Proxima Nova/i.test(font)) throw new Error('Mercado Pago font stack is not active');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pw/font.cjs
