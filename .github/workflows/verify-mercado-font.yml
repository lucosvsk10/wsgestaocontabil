name: Verify exact ADM font
on:
  push:
    branches: [verify/extractor-ux-round2]
    paths: [.github/workflows/verify-mercado-font.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify production font
        run: |
          cat > /tmp/pw/font.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1500,height:900}});
            const r=await page.goto('https://wsgestaocontabil.lovable.app/extrator-preview',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(5000);
            const computed=await page.evaluate(()=>{
              const app=document.querySelector('.extractor-app');
              const h1=document.querySelector('.extractor-app h1');
              return {
                font:getComputedStyle(app).fontFamily,
                spacing:getComputedStyle(app).letterSpacing,
                h1Spacing:h1?getComputedStyle(h1).letterSpacing:null,
                h1Weight:h1?getComputedStyle(h1).fontWeight:null
              };
            });
            console.log('HTTP',r?.status(),'URL',page.url(),'COMPUTED',JSON.stringify(computed));
            if(!/Space Grotesk/i.test(computed.font)) throw new Error('ADM font is not active');
            if(computed.spacing!=='-0.075px') throw new Error('ADM base tracking is not active');
            if(computed.h1Weight!=='600') throw new Error('ADM heading weight is not active');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pw/font.cjs
