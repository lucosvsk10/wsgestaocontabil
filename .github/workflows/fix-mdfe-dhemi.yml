name: Fix MDF-e dhEmi
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mdfe-dhemi.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove milliseconds from MDF-e dhEmi
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          old='function nowBR(){return new Date(Date.now()-3*3600000).toISOString().replace("Z","-03:00")}'
          new='function nowBR(){return new Date(Date.now()-3*3600000).toISOString().slice(0,19)+"-03:00"}'
          if old not in s:
              raise SystemExit('nowBR pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts
          git diff --cached --quiet || (git commit -m 'fix: format MDF-e dhEmi without milliseconds' && git push)
