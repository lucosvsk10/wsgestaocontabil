name: Fix SaaS navbar logo
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-saas-navbar-logo.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use standard-mode logo in SaaS topbar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SaasApp.tsx')
          s=p.read_text()
          old="const WS_LOGO = '/lovable-uploads/f7fdf0cf-f16c-4df7-a92c-964aadea9539.png';"
          new="const WS_LOGO = '/lovable-uploads/fecb5c37-c321-44e3-89ca-58de7e59e59d.png';"
          if old not in s:
              raise SystemExit('current SaaS logo constant not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SaasApp.tsx
          git commit -m 'fix(saas): use standard logo in dark navbar'
          git push
