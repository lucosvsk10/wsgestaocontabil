name: Publish public video asset

on:
  push:
    paths:
      - '.media-upload/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild office video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          cat .media-upload/video-*.txt | base64 --decode > public/assets/ws-escritorio-tour-hq-web.mp4
          test -s public/assets/ws-escritorio-tour-hq-web.mp4
          rm -rf .media-upload
      - name: Commit binary asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ws-escritorio-tour-hq-web.mp4 .media-upload
          git commit -m "fix: publish office video asset"
          git push
