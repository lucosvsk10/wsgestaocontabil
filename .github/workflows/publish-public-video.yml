name: Publish public media assets

on:
  push:
    paths:
      - '.media-upload/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild public media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          cat .media-upload/image-*.txt | base64 --decode > public/assets/ws-contador-cutout-new.webp
          cat .media-upload/video-*.txt | base64 --decode > public/assets/ws-escritorio-tour-hq-web.mp4
          test -s public/assets/ws-contador-cutout-new.webp
          test -s public/assets/ws-escritorio-tour-hq-web.mp4
          file public/assets/ws-contador-cutout-new.webp | grep -qi 'webp'
          file public/assets/ws-escritorio-tour-hq-web.mp4 | grep -qi 'mp4\|media'
          rm -rf .media-upload
      - name: Commit binary assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ws-contador-cutout-new.webp public/assets/ws-escritorio-tour-hq-web.mp4 .media-upload
          git commit -m "fix: publish contador photo and office video"
          git push
