name: Fix SaaS navbar logo colors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-saas-navbar-logo-filter.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original navbar logo colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/saas-native-font.css')
          s=p.read_text()
          old=".saas-admin-light .saas-topbar img { filter:brightness(0) invert(1) opacity(.96) !important; }"
          new=".saas-admin-light .saas-topbar img { filter:none !important; opacity:1 !important; }"
          if old not in s:
              raise SystemExit('navbar image filter rule not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/saas-native-font.css
          git commit -m 'fix(saas): preserve standard navbar logo colors'
          git push
