name: Compact account drawer mobile

on:
  push:
    paths:
      - '.github/workflows/compact-account-mobile.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compact mobile account UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/account/AccountDrawer.tsx')
          s = p.read_text()
          replacements = {
            "padding:18px 16px 17px;": "padding:15px 14px 14px;",
            "width:48px; height:48px;": "width:44px; height:44px;",
            "font-size:18px !important; line-height:1.2 !important;": "font-size:16px !important; line-height:1.2 !important;",
            "font-size:13px !important; line-height:1.4 !important;": "font-size:12px !important; line-height:1.4 !important;",
            "margin-top:4px; font-size:11px !important; line-height:1.4 !important;": "margin-top:3px; font-size:10px !important; line-height:1.35 !important;",
            "padding:11px 12px 10px;": "padding:8px 10px 8px;",
            "gap:7px;": "gap:5px;",
            "min-height:38px;": "min-height:34px;",
            "border-radius:8px;": "border-radius:6px;",
            "padding:0 14px;": "padding:0 11px;",
            "font-size:13px !important;\n      font-weight:400 !important;": "font-size:12px !important;\n      font-weight:400 !important;",
            "padding:22px 16px 32px;": "padding:18px 14px 26px;",
            "margin-bottom:18px;": "margin-bottom:14px;",
            "font-size:11px !important;": "font-size:10px !important;",
            "font-size:18px !important; line-height:1.25 !important;": "font-size:16px !important; line-height:1.25 !important;",
            "font-size:13px !important; line-height:1.55 !important;": "font-size:12px !important; line-height:1.5 !important;",
            "gap:14px;": "gap:10px;",
            "gap:10px;": "gap:8px;",
            "border-radius:10px;": "border-radius:8px;",
            "padding:16px; gap:12px;": "padding:13px; gap:10px;",
            "font-size:17px !important;": "font-size:15px !important;",
            "font-size:18px !important;": "font-size:16px !important;",
            "min-height:28px; padding:0 10px; border-radius:7px;": "min-height:24px; padding:0 8px; border-radius:5px;",
            "min-height:78px; padding:14px;": "min-height:64px; padding:12px;",
            "margin-top:8px; font-size:14px !important;": "margin-top:6px; font-size:13px !important;",
            "padding:15px;": "padding:12px;",
            "min-height:46px; margin-top:1px;": "min-height:40px; margin-top:0;",
            "padding:11px 12px max(11px,env(safe-area-inset-bottom));": "padding:8px 10px max(8px,env(safe-area-inset-bottom));",
            "min-height:46px; border-radius:9px;": "min-height:40px; border-radius:7px;"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/account/AccountDrawer.tsx
          git commit -m "style(saas): compact account drawer mobile scale"
          git push
