name: Fix MDFe prevalidation and QRCode
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mdfe-prevalidate-and-qrcode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MDF-e backend and SaaS test scenario
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          if 'const TEST_NFE_KEY=' not in s:
              anchor='function dv(base:string)'
              s=s.replace(anchor,'const TEST_NFE_KEY="27260912345678000195550010000000011123456780";\nconst PLACEHOLDER_RNTRC="12345678";\n'+anchor,1)
          old='keys=(raw.chaves||[]).map((x:any)=>digits(x)).filter((x:string)=>x.length===44),docs=keys.map((k:string)=>k.slice(20,22)==="57"?`<infCTe><chCTe>${k}</chCTe></infCTe>`:`<infNFe><chNFe>${k}</chNFe></infNFe>`).join("")'
          new='keys=(raw.chaves||[]).map((x:any)=>digits(x)).filter((x:string)=>x.length===44),rntrc=digits(raw.rntrc),rntrcXml=rntrc?`<RNTRC>${rntrc}</RNTRC>`:"",docs=keys.map((k:string)=>k.slice(20,22)==="57"?`<infCTe><chCTe>${k}</chCTe></infCTe>`:`<infNFe><chNFe>${k}</chNFe></infNFe>`).join("")'
          if old in s: s=s.replace(old,new,1)
          s=s.replace('<infANTT><RNTRC>${digits(raw.rntrc)}</RNTRC><infContratante>','<infANTT>${rntrcXml}<infContratante>',1)
          s=s.replace('</tot></infMDFe></MDFe>`;return{xml,chave,total:Number(raw.valorCarga||0)}}','</tot></infMDFe><infMDFeSupl><qrCodMDFe>https://dfe-portal.svrs.rs.gov.br/mdfe/qrCode?chMDFe=${chave}&amp;tpAmb=${tpAmb}</qrCodMDFe></infMDFeSupl></MDFe>`;return{xml,chave,total:Number(raw.valorCarga||0)}}',1)
          marker='const errors:string[]=[];'
          harden='''if(!production&&String(raw.tpEmit||"1")==="1"){
            const ks=(raw.chaves||[]).map((x:any)=>digits(x)).filter((x:string)=>x.length===44);
            if(ks.includes(TEST_NFE_KEY)){
              const {data:testCte}=await admin.from("saas_fiscal_emissions").select("access_key").eq("organization_id",orgId).eq("document_type","cte").eq("status","authorized").eq("environment","homologation").order("created_at",{ascending:false}).limit(1).maybeSingle();
              if(digits(testCte?.access_key).length===44)raw.chaves=ks.map((k:string)=>k===TEST_NFE_KEY?digits(testCte.access_key):k);
            }
            if(digits(raw.rntrc)===PLACEHOLDER_RNTRC&&String(raw.ufIni||p.state||"")===String(raw.ufFim||p.state||""))raw.rntrc="";
          }
          const errors:string[]=[];'''
          if marker in s and 'ks.includes(TEST_NFE_KEY)' not in s: s=s.replace(marker,harden,1)
          s=s.replace('if(!digits(raw.rntrc))errors.push("RNTRC obrigatório");','if(String(raw.ufIni||p.state||"")!==String(raw.ufFim||p.state||"")&&!digits(raw.rntrc))errors.push("RNTRC obrigatório para operação interestadual");',1)
          check='if(!(raw.chaves||[]).some((x:any)=>digits(x).length===44))errors.push("Informe ao menos uma chave NF-e/CT-e de 44 dígitos");'
          repl=check+'const docKeys=(raw.chaves||[]).map((x:any)=>digits(x)).filter((x:string)=>x.length===44);if(String(raw.tpEmit||"1")==="1"&&docKeys.some((k:string)=>k.slice(20,22)!=="57"))errors.push("Prestador de Serviço de Transporte deve vincular CT-e (modelo 57), não NF-e");if(String(raw.tpEmit||"1")==="2"&&docKeys.some((k:string)=>k.slice(20,22)==="57"))errors.push("Transportador de Carga Própria deve vincular NF-e, não CT-e");'
          if check in s and 'Prestador de Serviço de Transporte deve vincular' not in s: s=s.replace(check,repl,1)
          p.write_text(s)

          f=Path('src/components/saas/SaasEmission.tsx')
          t=f.read_text()
          if 'PLACEHOLDER_CTE_KEY' not in t:
              t=t.replace('const PLACEHOLDER_NFE_KEY="27260912345678000195550010000000011123456780";','const PLACEHOLDER_NFE_KEY="27260912345678000195550010000000011123456780";\nconst PLACEHOLDER_CTE_KEY="27260944454631000156570010000000021673862974";',1)
          old='const nfe=hist.find(x=>x.document_type==="nfe"&&x.status==="authorized"&&digits(x.access_key).length===44);\n const key=nfe?.access_key||PLACEHOLDER_NFE_KEY;'
          new='const nfe=hist.find(x=>x.document_type==="nfe"&&x.status==="authorized"&&digits(x.access_key).length===44);\n const cte=hist.find(x=>x.document_type==="cte"&&x.status==="authorized"&&digits(x.access_key).length===44);\n const key=nfe?.access_key||PLACEHOLDER_NFE_KEY;\n const mdfeKey=cte?.access_key||PLACEHOLDER_CTE_KEY;'
          if old in t: t=t.replace(old,new,1)
          t=t.replace('keys:fill(f.keys,key),','keys:fill(f.keys,mdfeKey),',1)
          t=t.replace('const latestAuthorizedNfe=history.find(x=>x.document_type==="nfe"&&x.status==="authorized"&&digits(x.access_key).length===44);','const latestAuthorizedNfe=history.find(x=>x.document_type==="nfe"&&x.status==="authorized"&&digits(x.access_key).length===44);\n const latestAuthorizedCte=history.find(x=>x.document_type==="cte"&&x.status==="authorized"&&digits(x.access_key).length===44);',1)
          t=t.replace('setMsg(latestAuthorizedNfe?"Cenário de transporte carregado com uma NF-e autorizada do histórico. Confira o RNTRC real antes de transmitir.":"Cenário de transporte carregado com dados fictícios de homologação. Confira chave fiscal e RNTRC reais antes de transmitir.");','setMsg(documentType==="MDF-e"?(latestAuthorizedCte?"Cenário de MDF-e carregado com CT-e autorizado do histórico.":"Cenário de MDF-e carregado. Em homologação, use CT-e autorizado para prestador de serviço."):(latestAuthorizedNfe?"Cenário de transporte carregado com uma NF-e autorizada do histórico. Confira o RNTRC real antes de transmitir.":"Cenário de transporte carregado com dados fictícios de homologação. Confira chave fiscal e RNTRC reais antes de transmitir."));',1)
          f.write_text(t)
      - name: Commit patch
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts src/components/saas/SaasEmission.tsx
          git diff --cached --quiet || (git commit -m 'fix: prevalidate MDF-e transport rules and QR code' && git push)
