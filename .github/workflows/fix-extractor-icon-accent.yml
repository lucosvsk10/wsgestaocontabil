name: Fix extractor icon accent

on:
  push:
    branches:
      - fix/extractor-icon-language
    paths:
      - scripts/fix-extractor-icon-accent.mjs
      - .github/workflows/fix-extractor-icon-accent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extractor-icon-language
          fetch-depth: 0
      - run: node scripts/fix-extractor-icon-accent.mjs
      - name: Commit fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-extractor-icon-accent.mjs .github/workflows/fix-extractor-icon-accent.yml
          git add src/styles/fiscal-extractor.css
          git commit -m "fix(extractor): use defined accent token for icons"
          git push origin HEAD:fix/extractor-icon-language
