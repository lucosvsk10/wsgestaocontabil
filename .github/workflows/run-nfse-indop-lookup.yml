name: Run NFS-e cIndOp lookup patch
on:
  push:
    paths:
      - 'scripts/patch_nfse_indop_lookup.py'
      - '.github/workflows/run-nfse-indop-lookup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_nfse_indop_lookup.py
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - name: Commit cIndOp lookup
        run: |
          git config user.name ws-fiscal-bot
          git config user.email ws-fiscal-bot@users.noreply.github.com
          git add src/components/saas/NfseOfficialFlow.tsx
          git commit -m "feat: make NFS-e cIndOp searchable"
          git push
