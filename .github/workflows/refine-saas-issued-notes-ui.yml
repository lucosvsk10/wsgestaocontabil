name: Refine SaaS issued notes UI

on:
  push:
    paths:
      - '.github/workflows/refine-saas-issued-notes-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine SaaS issued notes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/saas/SaasIssuedNotes.tsx')
          s=p.read_text()

          s=s.replace('const [tab,setTab]=useState("Todas");','const [tab,setTab]=useState("");')

          old=''' const tabs=[\n  {label:"Todas",count:scoped.length},\n  {label:"Autorizadas",count:authorized.length},\n  {label:"Rascunhos",count:scoped.filter(x=>x.status==="draft").length},\n  {label:"Em andamento",count:scoped.filter(x=>x.status==="validated").length},\n  {label:"Canceladas",count:cancelled.length},\n  ...typeCounts,\n ];'''
          new=''' const tabs=typeCounts;'''
          if old not in s: raise SystemExit('tabs block not found')
          s=s.replace(old,new,1)

          old='''  const matchesTab=tab==="Todas"||(tab==="Autorizadas"&&item.status==="authorized")||(tab==="Rascunhos"&&item.status==="draft")||(tab==="Em andamento"&&item.status==="validated")||(tab==="Canceladas"&&(item.status==="cancelled"||Boolean(item.cancelled_at)))||typeLabel(item)===tab;'''
          new='''  const matchesTab=!tab||typeLabel(item)===tab;'''
          if old not in s: raise SystemExit('matchesTab not found')
          s=s.replace(old,new,1)

          s=s.replace(''' const chooseTab=(v:string)=>{setTab(v);setPage(1)};''',''' const chooseTab=(v:string)=>{setTab(current=>current===v?"":v);setPage(1)};''',1)
          s=s.replace(''' const moveYear=(delta:number)=>{setYear(y=>y+delta);setPage(1)};''',''' const moveYear=(delta:number)=>{setYear(y=>Math.min(now.getFullYear(),y+delta));setPage(1)};''',1)
          s=s.replace(''' const chooseMonth=(value:number|null)=>{setMonth(value);setPage(1)};''',''' const chooseMonth=(value:number|null)=>{if(value!==null&&year===now.getFullYear()&&value>now.getMonth())return;setMonth(value);setPage(1)};''',1)

          s=s.replace('''<button onClick={()=>moveYear(1)} className="mr-3 grid h-9 w-9 place-items-center rounded-lg text-[#64748b] hover:bg-[#f3f6f9]">›</button>''','''<button disabled={year>=now.getFullYear()} onClick={()=>moveYear(1)} className="mr-3 grid h-9 w-9 place-items-center rounded-lg text-[#64748b] hover:bg-[#f3f6f9] disabled:cursor-default disabled:opacity-25">›</button>''',1)

          old='''    <button onClick={()=>chooseMonth(null)} className={`min-w-11 rounded-lg px-3 py-2 text-sm font-medium transition ${month===null?"bg-[#eef3f8] text-[#0f172a] shadow-sm":"text-[#475569] hover:bg-[#f5f7fa]"}`}>Ano</button>\n    {MONTHS.map((m,i)=><button key={m} onClick={()=>chooseMonth(i)} className={`min-w-11 rounded-lg px-3 py-2 text-sm font-medium transition ${month===i?"bg-[#eef3f8] text-[#0f172a] shadow-sm":"text-[#475569] hover:bg-[#f5f7fa]"}`}>{m}</button>)}'''
          new='''    <button onClick={()=>chooseMonth(null)} className={`px-3 py-2 text-sm font-medium transition ${month===null?"text-[#0f172a] underline decoration-[#1597c8] decoration-2 underline-offset-[10px]":"text-[#475569] hover:text-[#0f172a]"}`}>Ano</button>\n    {MONTHS.map((m,i)=>{const future=year===now.getFullYear()&&i>now.getMonth();return <button key={m} disabled={future} onClick={()=>chooseMonth(i)} className={`px-3 py-2 text-sm font-medium transition ${future?"cursor-default text-[#c5ccd5]":month===i?"text-[#0f172a] underline decoration-[#1597c8] decoration-2 underline-offset-[10px]":"text-[#475569] hover:text-[#0f172a]"}`}>{m}</button>})}'''
          if old not in s: raise SystemExit('month buttons not found')
          s=s.replace(old,new,1)

          old='''    {tabs.map(t=><button key={t.label} onClick={()=>chooseTab(t.label)} className={`rounded-lg px-3 py-1.5 text-xs font-medium transition ${tab===t.label?"bg-[#e7f4fb] text-[#0877a8]":"bg-[#f4f6f8] text-[#526173] hover:bg-[#edf1f5]"}`}>{t.label} <b>{t.count}</b></button>)}'''
          new='''    {tabs.map(t=><button key={t.name} onClick={()=>chooseTab(t.name)} className={`rounded-lg border px-3 py-1.5 text-xs font-semibold transition ${tab===t.name?"border-[#8fc7df] bg-transparent text-[#0877a8]":"border-[#d9e0e8] bg-transparent text-[#526173] hover:border-[#b8c5d1] hover:text-[#0f172a]"}`}>{t.name} <b>{t.count}</b></button>)}'''
          if old not in s: raise SystemExit('filter buttons not found')
          s=s.replace(old,new,1)

          s=s.replace('''<button className="ml-auto inline-flex h-9 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#475569] hover:bg-[#f5f7fa]"><CalendarDays className="h-4 w-4"/>Personalizado</button>''','''<button className="ml-auto inline-flex h-9 items-center gap-2 rounded-lg border border-[#d9e0e8] bg-transparent px-3 text-sm font-semibold text-[#475569] transition hover:bg-[#f8fafc]"><CalendarDays className="h-4 w-4"/>Personalizado</button>''',1)
          s=s.replace('''<button className="inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-[#d9e0e8] bg-white px-4 text-xs font-semibold text-[#0f172a] shadow-sm hover:bg-[#f8fafc]"><Download className="h-4 w-4"/>Download</button>''','''<button className="inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-[#d9e0e8] bg-transparent px-4 text-xs font-semibold text-[#0f172a] shadow-sm transition hover:bg-[#f8fafc]"><Download className="h-4 w-4"/>Download</button>''',1)

          s=s.replace('''${index%2===0?"bg-white":"bg-[#fbfcfd]"} hover:bg-[#f1f6fa]''','''${index%2===0?"bg-white":"bg-[#f2f5f8]"} hover:bg-[#eaf1f6]''',1)

          p.write_text(s)
          PY
      - name: Commit SaaS-only refinement and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refine-saas-issued-notes-ui.yml
          git add src/components/saas/SaasIssuedNotes.tsx .github/workflows/refine-saas-issued-notes-ui.yml
          git commit -m "refine(saas): simplify issued notes filters and period controls"
          git push
