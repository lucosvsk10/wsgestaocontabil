name: One Shot Central Company UI
on:
  push:
    paths:
      - '.github/workflows/one-shot-central-company-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch duplicate company selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch_accounting(path):
              p=Path(path)
              s=p.read_text()
              s=s.replace('import { CompanySelector } from "./CompanySelector";\n','')
              s=s.replace('const { company, companies, selectCompany } = useAccountingCompany();','const { company } = useAccountingCompany();')
              s=re.sub(r'<CompanySelector\s+company=\{company\}\s+companies=\{companies\}\s+onSelect=\{selectCompany\}\s*/>', '', s)
              s=re.sub(r'<div className="flex w-full flex-col gap-3 sm:flex-row xl:w-auto">\s*</div>', '', s)
              p.write_text(s)

          patch_accounting('src/components/admin/lancamentos/LancamentosWorkspace.tsx')
          patch_accounting('src/components/admin/lancamentos/BalanceteWorkspaceV2.tsx')

          p=Path('src/pages/AdminFiscalNotes.tsx')
          s=p.read_text()
          old='useEffect(()=>{void(async()=>{try{await loadCompanies()}catch(e){setError(e instanceof Error?e.message:String(e))}finally{setLoading(false)}})()},[]);'
          new='useEffect(()=>{void(async()=>{try{await loadCompanies()}catch(e){setError(e instanceof Error?e.message:String(e))}finally{setLoading(false)}})();const sync=()=>{const id=localStorage.getItem("ws_fiscal_company_id");if(!id)return;setCompanies(current=>{const next=current.find(x=>x.id===id);if(next)setCompany(next);return current})};window.addEventListener("ws:company-changed",sync as EventListener);window.addEventListener("storage",sync);return()=>{window.removeEventListener("ws:company-changed",sync as EventListener);window.removeEventListener("storage",sync)}} ,[]);'
          if old in s:
              s=s.replace(old,new)
          # Remove local company chooser function; global header owns selection now.
          s=re.sub(r' const choose=\(id:string\)=>\{[^\n]+\};\n','',s)
          # Replace the selected-company selector block with a compact status strip.
          s=re.sub(
              r'<section className="rounded-2xl bg-muted/10 px-5 py-4"><div className="flex flex-wrap items-center justify-between gap-4"><div className="flex min-w-0 items-center gap-4">.*?</section>\n <section className="relative mt-4',
              '<section className="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-muted/10 px-5 py-3"><div><p className="text-[10px] font-semibold uppercase tracking-[.15em] text-muted-foreground">Empresa ativa</p><p className="mt-1 text-sm font-semibold">{company?.nome_fantasia||company?.razao_social}</p><p className="text-xs text-muted-foreground">{formatCnpj(company?.cnpj||"")}</p></div><span className={`inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium ${certValid?"bg-emerald-500/10 text-emerald-600":"bg-destructive/10 text-destructive"}`}><ShieldCheck className="h-3.5 w-3.5"/>{certValid?"Certificado válido":"Certificado pendente"}</span></section>\n <section className="relative mt-4',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/lancamentos/LancamentosWorkspace.tsx src/components/admin/lancamentos/BalanceteWorkspaceV2.tsx src/pages/AdminFiscalNotes.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: centralize company selection across admin modules"
          git push
