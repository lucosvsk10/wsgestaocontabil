name: Apply extractor structure v2

on:
  push:
    branches:
      - fix/extractor-structure-v2
    paths:
      - .github/workflows/apply-extractor-structure-v2.yml
      - .github/scripts/patch_extractor_structure_v2.py

permissions:
  contents: write

jobs:
  patch-build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extractor-structure-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped refinements
        run: |
          python .github/scripts/patch_extractor_structure_v2.py
          sed -i 's/[[:space:]]\+$//' src/pages/FiscalExtractorApp.tsx

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit scoped changes
        run: |
          git config user.name "lucosvsk10"
          git config user.email "123520265+lucosvsk10@users.noreply.github.com"
          git add src supabase/migrations/20260908215500_isolate_extractor_product_and_usage.sql
          git commit -m "fix(extractor): isolate account and refine fiscal workspace"
          git push origin HEAD:fix/extractor-structure-v2

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run local preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/extractor-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/extrator-preview >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/extractor-vite.log
          exit 1

      - name: Visual structure assertions and screenshots
        run: |
          mkdir -p /tmp/extractor-shots
          cat >/tmp/check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:4173/extrator-preview',{waitUntil:'networkidle'});
            const logo=await page.locator('.extractor-brand img').getAttribute('src');
            if(!String(logo).includes('/assets/ws-logo.png')) throw new Error('standard WS logo not applied');
            const font=await page.locator('.extractor-app').evaluate(el=>getComputedStyle(el).fontFamily);
            if(!font.includes('Space Grotesk')) throw new Error(`wrong extractor font: ${font}`);
            await page.screenshot({path:'/tmp/extractor-shots/01-overview.png',fullPage:true});

            await page.getByRole('button',{name:'Empresas',exact:true}).click();
            await page.waitForTimeout(200);
            await page.screenshot({path:'/tmp/extractor-shots/02-companies.png',fullPage:true});

            await page.getByRole('button',{name:'Documentos',exact:true}).click();
            await page.waitForTimeout(200);
            const tbody=page.locator('.extractor-admin-table tbody');
            if(await tbody.count()){
              await tbody.evaluate(el=>{
                el.innerHTML='<tr class="ws-zebra-row"><td>Teste visual A</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr class="ws-zebra-row"><td>Teste visual B</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>';
              });
              const rows=page.locator('.extractor-admin-table tbody tr.ws-zebra-row');
              const odd=await rows.nth(0).evaluate(el=>getComputedStyle(el).backgroundColor);
              const even=await rows.nth(1).evaluate(el=>getComputedStyle(el).backgroundColor);
              if(odd==='rgb(255, 255, 255)'||even==='rgb(255, 255, 255)') throw new Error(`white fiscal table row detected: ${odd} / ${even}`);
              if(odd!=='rgb(2, 8, 23)') throw new Error(`odd row not ADM dark color: ${odd}`);
            }
            await page.screenshot({path:'/tmp/extractor-shots/03-documents.png',fullPage:true});

            await page.getByRole('button',{name:'Configurações',exact:true}).click();
            await page.waitForTimeout(200);
            if(!(await page.locator('.extractor-plan-hero').isVisible())) throw new Error('expanded plan usage area not visible');
            await page.screenshot({path:'/tmp/extractor-shots/04-settings.png',fullPage:true});

            const css=fs.readFileSync('src/styles/saas-native-font.css','utf8');
            const saas=fs.readFileSync('src/pages/SaasApp.tsx','utf8');
            if(!css.includes("'Space Grotesk'")) throw new Error('SaaS administrator font mismatch');
            if(!css.includes('#020817')) throw new Error('SaaS topbar not deep enough');
            if(!saas.includes("const WS_LOGO = '/assets/ws-logo.png'")) throw new Error('SaaS standard logo mismatch');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/check.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: extractor-structure-v2-preview
          path: /tmp/extractor-shots/*.png
          retention-days: 2
