name: Run official NFS-e backend patch
on:
  push:
    paths:
      - 'scripts/patch_nfse_backend_official.py'
      - '.github/workflows/run-nfse-backend-official.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_nfse_backend_official.py
      - name: Commit backend
        run: |
          git config user.name ws-fiscal-bot
          git config user.email ws-fiscal-bot@users.noreply.github.com
          git add supabase/functions/saas-nfse-issue/index.ts
          git commit -m "feat: map official NFS-e form into DPS"
          git push
