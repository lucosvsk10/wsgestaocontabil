name: Apply SaaS Space Grotesk
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-saas-space-grotesk.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply Space Grotesk to all SaaS UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/styles/saas-admin-reconciliation.css','src/styles/saas-admin-light.css']:
              p=Path(name)
              s=p.read_text()
              s=s.replace("font-family:'Prompt',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important", "font-family:'Space Grotesk','Inter',system-ui,sans-serif!important")
              s=s.replace("font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important", "font-family:'Space Grotesk','Inter',system-ui,sans-serif!important")
              p.write_text(s)
          PY
      - name: Validate build
        run: npm install --legacy-peer-deps && npm run build
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name ws-ui-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/saas-admin-reconciliation.css src/styles/saas-admin-light.css
          git diff --cached --quiet || git commit -m 'style(saas): apply Space Grotesk globally'
          git rm .github/workflows/apply-saas-space-grotesk.yml
          git commit -m 'chore: remove temporary SaaS font workflow'
          git push
