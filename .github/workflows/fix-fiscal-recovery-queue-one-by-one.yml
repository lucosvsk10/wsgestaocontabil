name: Fix fiscal recovery queue one by one

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiscal-recovery-queue-one-by-one.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fiscal recovery queue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminFiscalNotes.tsx')
          s = p.read_text()

          old = ' const[previewLoading,setPreviewLoading]=useState(false),[previewNotice,setPreviewNotice]=useState("");'
          new = ' const[previewLoading,setPreviewLoading]=useState(false),[previewNotice,setPreviewNotice]=useState(""),[recoveryBusy,setRecoveryBusy]=useState(false);'
          if old not in s:
              raise SystemExit('preview state marker not found')
          s = s.replace(old, new, 1)

          old = ' const loadDocs=async(c:Company|null,clear=false)=>{const request=++docsRequestRef.current;if(clear)setDocs([]);if(!c){setDocs([]);return}const db=supabase as any;const{data,error}=await db.from("fiscal_dfe_documents").select("*").eq("company_id",c.id).eq("cnpj",onlyDigits(c.cnpj)).eq("environment",c.ambiente_padrao||"producao").order("issue_date",{ascending:false}).limit(5000);if(error)throw error;if(request!==docsRequestRef.current)return;setDocs((data||[]).map(rowToDoc))};'
          new = old + '\n const recoveryPending30d=useMemo(()=>{const cutoff=Date.now()-30*24*60*60*1000;return docs.filter(d=>d.documentKind!=="evento"&&!(d.fullXml&&d.xml)&&/^\\d{44}$/.test(String(d.accessKey||""))&&["55","65"].includes(docModel(d))&&Boolean(d.issueDate)&&new Date(String(d.issueDate)).getTime()>=cutoff).length},[docs]);'
          if old not in s:
              raise SystemExit('loadDocs marker not found')
          s = s.replace(old, new, 1)

          old = ' useEffect(()=>{let active=true;docsRequestRef.current++;recoveryAttemptsRef.current={};setDocs([]);setSelected(null);setError("");setDownloadInfo(null);setPage(1);setQuery("");setFilter("todos");setTypeFilter("todos");setLoading(true);'
          new = ' useEffect(()=>{let active=true;docsRequestRef.current++;recoveryAttemptsRef.current={};setRecoveryBusy(false);setDocs([]);setSelected(null);setError("");setDownloadInfo(null);setPage(1);setQuery("");setFilter("todos");setTypeFilter("todos");setLoading(true);'
          if old not in s:
              raise SystemExit('reset effect marker not found')
          s = s.replace(old, new, 1)

          old = ' useEffect(()=>{if(!company)return;const cutoff=Date.now()-30*24*60*60*1000;const pending=docs.filter(d=>d.documentKind!=="evento"&&!d.fullXml&&/^\\d{44}$/.test(String(d.accessKey||""))&&["55","65"].includes(docModel(d))&&Boolean(d.issueDate)&&new Date(String(d.issueDate)).getTime()>=cutoff).filter(d=>(recoveryAttemptsRef.current[String(d.accessKey)]||0)<2).slice(0,2);if(!pending.length)return;let cancelled=false;const timer=window.setTimeout(async()=>{for(const d of pending){if(cancelled)break;const k=String(d.accessKey);recoveryAttemptsRef.current[k]=(recoveryAttemptsRef.current[k]||0)+1;try{await supabase.functions.invoke("fiscal-document-recover",{body:{company_id:company.id,access_key:d.accessKey,nsu:d.nsu}})}catch{}await new Promise(r=>window.setTimeout(r,1200))}if(!cancelled)void loadDocs(company,false).catch(()=>{})},2500);return()=>{cancelled=true;window.clearTimeout(timer)}},[company?.id,docs]);'
          new = ' useEffect(()=>{if(!company||recoveryBusy)return;const cutoff=Date.now()-30*24*60*60*1000;const next=docs.find(d=>d.documentKind!=="evento"&&!(d.fullXml&&d.xml)&&/^\\d{44}$/.test(String(d.accessKey||""))&&["55","65"].includes(docModel(d))&&Boolean(d.issueDate)&&new Date(String(d.issueDate)).getTime()>=cutoff&&(recoveryAttemptsRef.current[String(d.accessKey)]||0)<2);if(!next)return;let cancelled=false;const timer=window.setTimeout(async()=>{if(cancelled)return;const k=String(next.accessKey);recoveryAttemptsRef.current[k]=(recoveryAttemptsRef.current[k]||0)+1;setRecoveryBusy(true);try{await supabase.functions.invoke("fiscal-document-recover",{body:{company_id:company.id,access_key:next.accessKey,nsu:next.nsu}})}catch{}finally{if(!cancelled){await loadDocs(company,false).catch(()=>{});setRecoveryBusy(false)}}},2500);return()=>{cancelled=true;window.clearTimeout(timer)}},[company?.id,docs,recoveryBusy]);'
          if old not in s:
              raise SystemExit('recovery effect marker not found')
          s = s.replace(old, new, 1)

          old = ' <section className="mt-3 grid gap-2 md:grid-cols-4"><Kpi label="Total notas" value={String(fiscalDocs.length)}/><Kpi label="Arquivos completos" value={String(withXml.length)} sub={`${fiscalDocs.length?Math.round(withXml.length/fiscalDocs.length*100):0}%`}/><Kpi label="Aguardando arquivo" value={String(fiscalDocs.length-withXml.length)}/><Kpi label="Faturamento" value={money(emitted.reduce((s,d)=>s+Number(d.value||0),0))} sub={`Entradas: ${money(received.reduce((s,d)=>s+Number(d.value||0),0))}`}/></section>'
          status = old + '\n <section className={`mt-2 flex flex-wrap items-center justify-between gap-2 rounded-xl px-4 py-2.5 ${recoveryPending30d?"bg-amber-500/10":"bg-emerald-500/10"}`}><div><p className="text-[10px] font-semibold uppercase tracking-[.12em] text-muted-foreground">Recuperação automática</p><p className={`mt-0.5 text-sm font-medium ${recoveryPending30d?"text-amber-600":"text-emerald-600"}`}>{recoveryPending30d?`${recoveryPending30d} documento${recoveryPending30d===1?"":"s"} aguardando XML`:"XMLs dos últimos 30 dias em dia"}</p></div><p className="text-xs text-muted-foreground">{recoveryPending30d?(recoveryBusy?"Baixando 1 de cada vez":"Fila automática · 1 por vez"):"Últimos 30 dias"}</p></section>'
          if old not in s:
              raise SystemExit('KPI section marker not found')
          s = s.replace(old, status, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ws-fiscal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminFiscalNotes.tsx
          git commit -m "fix: restore one-by-one fiscal recovery queue"
          git push
