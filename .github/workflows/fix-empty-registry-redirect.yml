name: Fix empty registry redirect

on:
  push:
    branches:
      - fix/empty-registry-redirect

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/empty-registry-redirect
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore previous emission flow and add registry redirects
        shell: bash
        run: |
          git checkout 028feff4dea44e3095d94026a2c1bffeb0504d97 -- src/components/saas/SaasEmission.tsx src/pages/SaasApp.tsx
          python <<'PY'
          from pathlib import Path

          emission_path = Path('src/components/saas/SaasEmission.tsx')
          app_path = Path('src/pages/SaasApp.tsx')
          cad_path = Path('src/components/saas/SaasCadastros.tsx')
          s = emission_path.read_text()
          app = app_path.read_text()
          cad = cad_path.read_text()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def many(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrences, found {count}')
              return text.replace(old, new)

          # CatalogPicker: when the catalog is empty, the dropdown itself becomes the path to creation.
          s = once(
              s,
              "  kind,\n  required = false,\n}: {",
              "  kind,\n  required = false,\n  emptyActionLabel,\n  onEmptyAction,\n}: {",
              'catalog picker props',
          )
          s = once(
              s,
              "  kind: 'product' | 'service';\n  required?: boolean;\n}) {",
              "  kind: 'product' | 'service';\n  required?: boolean;\n  emptyActionLabel?: string;\n  onEmptyAction?: () => void;\n}) {",
              'catalog picker prop types',
          )
          s = once(
              s,
              "            {chosen?.name || `Selecionar ${kind === 'product' ? 'produto' : 'serviço'}`}",
              "            {chosen?.name || (items.length === 0\n              ? `Nenhum ${kind === 'product' ? 'produto' : 'serviço'} cadastrado`\n              : `Selecionar ${kind === 'product' ? 'produto' : 'serviço'}`)}",
              'catalog picker empty label',
          )
          s = once(
              s,
              "              : 'Pesquise no seu cadastro'}",
              "              : items.length === 0 && onEmptyAction\n                ? 'Abra para adicionar ao cadastro'\n                : 'Pesquise no seu cadastro'}",
              'catalog picker empty hint',
          )
          s = once(
              s,
              "            ) : (\n              <p className=\"p-5 text-center text-xs text-slate-500\">Nenhum cadastro encontrado.</p>\n            )}",
              "            ) : items.length === 0 && onEmptyAction ? (\n              <button\n                type=\"button\"\n                className=\"ca-picker-row w-full text-left\"\n                onClick={() => {\n                  setOpen(false);\n                  setQ('');\n                  onEmptyAction();\n                }}\n              >\n                <span>\n                  <strong>Nenhum {kind === 'product' ? 'produto' : 'serviço'} cadastrado</strong>\n                  <small>{emptyActionLabel || 'Adicionar ao cadastro'}</small>\n                </span>\n                <b>Adicionar</b>\n              </button>\n            ) : (\n              <p className=\"p-5 text-center text-xs text-slate-500\">Nenhum cadastro encontrado.</p>\n            )}",
              'catalog picker empty action',
          )

          # SaasEmission navigation callback only; no manual fiscal data fallback.
          s = once(
              s,
              "  onReuseConsumed,\n}: {",
              "  onReuseConsumed,\n  onOpenCadastro,\n}: {",
              'emission callback destructure',
          )
          s = once(
              s,
              "  onReuseConsumed?: () => void;\n}) {",
              "  onReuseConsumed?: () => void;\n  onOpenCadastro?: (section: 'Clientes' | 'Produtos' | 'Serviços' | 'Transportadoras') => void;\n}) {",
              'emission callback type',
          )
          selected = "  const customer = customers.find(x => x.id === form.customerId),\n    product = products.find(x => x.id === form.productId),\n    service = services.find(x => x.id === form.serviceId),\n    rem = customers.find(x => x.id === form.remetenteId),\n    dest = customers.find(x => x.id === form.destinatarioId),\n    carrier = carriers.find(x => x.id === form.carrierId);"
          s = once(
              s,
              selected,
              selected + "\n  const chooseOrCreate = (\n    key: string,\n    value: string,\n    section: 'Clientes' | 'Produtos' | 'Serviços' | 'Transportadoras'\n  ) => {\n    if (value === '__new__') {\n      onOpenCadastro?.(section);\n      return;\n    }\n    set(key, value);\n  };",
              'choose or create helper',
          )

          # Existing native dropdowns keep their current information; an empty one exposes only the creation path.
          s = many(
              s,
              "onChange={v => set('customerId', v)}",
              "onChange={v => chooseOrCreate('customerId', v, 'Clientes')}",
              2,
              'customer dropdown handlers',
          )
          s = once(
              s,
              "onChange={v => set('remetenteId', v)}",
              "onChange={v => chooseOrCreate('remetenteId', v, 'Clientes')}",
              'remetente dropdown handler',
          )
          s = once(
              s,
              "onChange={v => set('destinatarioId', v)}",
              "onChange={v => chooseOrCreate('destinatarioId', v, 'Clientes')}",
              'destinatario dropdown handler',
          )
          s = many(
              s,
              "onChange={v => set('carrierId', v)}",
              "onChange={v => chooseOrCreate('carrierId', v, 'Transportadoras')}",
              2,
              'carrier dropdown handlers',
          )

          s = once(
              s,
              "              </option>\n              {customers.map(x => (",
              "              </option>\n              {customers.length === 0 && documentType === 'NF-e' && (\n                <option value=\"__new__\">Adicionar cliente</option>\n              )}\n              {customers.length === 0 && documentType === 'NFC-e' && (\n                <option value=\"__new__\">Adicionar cliente identificado</option>\n              )}\n              {customers.map(x => (",
              'nfe customer add option',
          )
          s = once(
              s,
              "              <option value=\"\">Selecione um cliente</option>\n              {customers.map(x => (",
              "              <option value=\"\">{customers.length ? 'Selecione um cliente' : 'Nenhum cliente cadastrado'}</option>\n              {customers.length === 0 && <option value=\"__new__\">Adicionar cliente</option>}\n              {customers.map(x => (",
              'nfse customer add option',
          )
          s = many(
              s,
              "              <option value=\"\">Selecione</option>\n              {customers.map(x => (",
              "              <option value=\"\">{customers.length ? 'Selecione' : 'Nenhum cliente cadastrado'}</option>\n              {customers.length === 0 && <option value=\"__new__\">Adicionar cliente</option>}\n              {customers.map(x => (",
              2,
              'cte customer add options',
          )
          s = many(
              s,
              "              <option value=\"\">Própria / manual</option>\n              {carriers.map(x => (",
              "              <option value=\"\">Própria</option>\n              {carriers.length === 0 && <option value=\"__new__\">Adicionar transportadora</option>}\n              {carriers.map(x => (",
              2,
              'carrier add options',
          )

          product_picker = """            <CatalogPicker\n              label=\"Produto\"\n              value={form.productId}\n              onChange={v => set('productId', v)}\n              items={products}\n              kind=\"product\"\n              required\n            />"""
          s = once(
              s,
              product_picker,
              """            <CatalogPicker\n              label=\"Produto\"\n              value={form.productId}\n              onChange={v => set('productId', v)}\n              items={products}\n              kind=\"product\"\n              required\n              emptyActionLabel=\"Adicionar produto\"\n              onEmptyAction={() => onOpenCadastro?.('Produtos')}\n            />""",
              'product picker redirect',
          )
          service_picker = """            <CatalogPicker\n              label=\"Serviço\"\n              value={form.serviceId}\n              onChange={v => set('serviceId', v)}\n              items={services}\n              kind=\"service\"\n              required\n            />"""
          s = once(
              s,
              service_picker,
              """            <CatalogPicker\n              label=\"Serviço\"\n              value={form.serviceId}\n              onChange={v => set('serviceId', v)}\n              items={services}\n              kind=\"service\"\n              required\n              emptyActionLabel=\"Adicionar serviço\"\n              onEmptyAction={() => onOpenCadastro?.('Serviços')}\n            />""",
              'service picker redirect',
          )

          # SaasApp remembers that navigation came from an empty dropdown and opens the new-record editor directly.
          app = once(
              app,
              "  const [reusableEmission, setReusableEmission] = useState<any>(null);\n  const organizationRequest = useRef(0);",
              "  const [reusableEmission, setReusableEmission] = useState<any>(null);\n  const [pendingCadastroCreate, setPendingCadastroCreate] = useState<CadastroSection | null>(null);\n  const organizationRequest = useRef(0);",
              'pending cadastro state',
          )
          app = once(
              app,
              "  const chooseNav = (item: string) => {\n    setMobileMenuOpen(false);",
              "  const chooseNav = (item: string) => {\n    setMobileMenuOpen(false);\n    setPendingCadastroCreate(null);",
              'clear pending cadastro on nav',
          )
          choose_nav_end = """    setSelectedDocument(null);\n    setReusableEmission(null);\n    setActive(item);\n  };\n\n  const reuseEmission"""
          app = once(
              app,
              choose_nav_end,
              """    setSelectedDocument(null);\n    setReusableEmission(null);\n    setActive(item);\n  };\n\n  const openCadastroCreate = (section: CadastroSection) => {\n    setSelectedDocument(null);\n    setReusableEmission(null);\n    setPendingCadastroCreate(section);\n    setActive(section);\n  };\n\n  const reuseEmission""",
              'open cadastro create helper',
          )
          app = once(
              app,
              """      <SaasCadastros\n        organizationId={organization?.id || null}\n        section={active as CadastroSection}\n      />""",
              """      <SaasCadastros\n        organizationId={organization?.id || null}\n        section={active as CadastroSection}\n        autoCreate={pendingCadastroCreate === active}\n        onAutoCreateConsumed={() => setPendingCadastroCreate(null)}\n      />""",
              'cadastros auto create props',
          )
          app = once(
              app,
              "        onReuseConsumed={() => setReusableEmission(null)}\n      />",
              "        onReuseConsumed={() => setReusableEmission(null)}\n        onOpenCadastro={openCadastroCreate}\n      />",
              'emission open cadastro callback',
          )

          # Cadastro page receives a one-shot autoCreate flag and lands directly on the existing New form.
          cad = once(
              cad,
              "type Props = { organizationId: string | null; section: CadastroSection };",
              "type Props = {\n  organizationId: string | null;\n  section: CadastroSection;\n  autoCreate?: boolean;\n  onAutoCreateConsumed?: () => void;\n};",
              'cadastro props',
          )
          cad = once(
              cad,
              "export default function SaasCadastros({ organizationId, section }: Props) {",
              "export default function SaasCadastros({\n  organizationId,\n  section,\n  autoCreate = false,\n  onAutoCreateConsumed,\n}: Props) {",
              'cadastro destructure',
          )
          create_block = """  const create = () => {\n    resetImageState();\n    setForm(isCatalog ? blankCatalog(section) : blankParty(section));\n    setMessage('');\n  };"""
          cad = once(
              cad,
              create_block,
              create_block + """\n\n  useEffect(() => {\n    if (!autoCreate || !organizationId) return;\n    create();\n    onAutoCreateConsumed?.();\n  }, [autoCreate, organizationId, section]);""",
              'auto create effect',
          )

          emission_path.write_text(s)
          app_path.write_text(app)
          cad_path.write_text(cad)
          PY
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit verified correction
        shell: bash
        run: |
          rm -f .github/workflows/fix-empty-registry-redirect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/saas/SaasEmission.tsx src/pages/SaasApp.tsx src/components/saas/SaasCadastros.tsx .github/workflows/fix-empty-registry-redirect.yml
          git commit -m "fix(saas): redirect empty emission dropdowns to new registry form"
          git push origin HEAD:fix/empty-registry-redirect
