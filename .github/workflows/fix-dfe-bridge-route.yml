name: Fix DFe bridge route

on:
  push:
    paths:
      - '.github/workflows/fix-dfe-bridge-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bridge endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/dfe-extractor-native/index.ts')
          s = p.read_text()
          old = 'https://ws-dfe-bridge.vercel.app/distribuicao'
          new = 'https://ws-dfe-bridge.vercel.app/api/distribuicao'
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit('Expected bridge URL not found')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/dfe-extractor-native/index.ts
          git commit -m 'fix: use working DFe bridge endpoint'
          git push
