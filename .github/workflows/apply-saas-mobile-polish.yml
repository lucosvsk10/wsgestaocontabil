name: Apply SaaS mobile polish
on:
  push:
    paths:
      - '.github/workflows/apply-saas-mobile-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import final mobile polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SaasApp.tsx')
          s=p.read_text()
          marker="import '@/styles/saas-native-font.css';"
          line="import '@/styles/saas-mobile-polish.css';"
          if line not in s:
              s=s.replace(marker, marker+'\n'+line)
              p.write_text(s)
          PY
      - name: Validate
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/SaasApp.tsx
          git diff --cached --quiet || git commit -m "style(saas): load final mobile polish"
          git push
