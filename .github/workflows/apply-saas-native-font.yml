name: Apply SaaS native font
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load native font stylesheet last
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SaasApp.tsx')
          s=p.read_text()
          needle="import '@/styles/saas-admin-reconciliation.css';"
          line="import '@/styles/saas-native-font.css';"
          if line not in s:
              s=s.replace(needle, needle+'\n'+line)
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'ws-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SaasApp.tsx src/styles/saas-native-font.css
          if ! git diff --cached --quiet; then git commit -m 'style(saas): use native lighter system typography'; fi
          git rm .github/workflows/apply-saas-native-font.yml
          git commit -m 'chore: remove temporary native font workflow'
          git push
