name: Fix fiscal panel auto refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiscal-auto-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fiscal extractor refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/fiscal/FiscalExtractorPanel.tsx')
          text = p.read_text()
          marker = '  const fetchDocuments = async () => {'
          block = '''  useEffect(() => {\n    if (cnpj.length !== 14) return;\n    const refresh = () => { void reloadStored(); };\n    const timer = window.setInterval(refresh, 15000);\n    const onFocus = () => { void reloadStored(); };\n    window.addEventListener("focus", onFocus);\n    return () => {\n      window.clearInterval(timer);\n      window.removeEventListener("focus", onFocus);\n    };\n  }, [cnpj, environment, ufCode]);\n\n'''
          if block.strip() in text:
              print('Auto-refresh already present')
          elif marker not in text:
              raise SystemExit('Patch marker not found')
          else:
              p.write_text(text.replace(marker, block + marker, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ws-fiscal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/admin/fiscal/FiscalExtractorPanel.tsx
          git commit -m "fix: auto refresh fiscal documents"
          git push
