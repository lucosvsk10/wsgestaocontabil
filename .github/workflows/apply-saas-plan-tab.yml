name: Apply SaaS plan tab redesign

on:
  push:
    paths:
      - '.github/workflows/apply-saas-plan-tab.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redesign only SaaS Meu plano tab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/account/AccountDrawer.tsx')
          s = p.read_text()

          s = s.replace(
          '''  notifications?: Array<{ title: string; text: string }>;\n};''',
          '''  notifications?: Array<{ title: string; text: string }>;\n  billingMode?: "default" | "saas";\n  organizationName?: string | null;\n  organizationTaxId?: string | null;\n};''', 1)

          s = s.replace(
          '''  avatarUrl = null,\n  notifications = [],\n}: AccountDrawerProps) {''',
          '''  avatarUrl = null,\n  notifications = [],\n  billingMode = "default",\n  organizationName = null,\n  organizationTaxId = null,\n}: AccountDrawerProps) {''', 1)

          s = s.replace(
          '''          <aside className="ws-account-drawer" aria-label="Perfil e configurações da conta">''',
          '''          <aside className={`ws-account-drawer ${billingMode === "saas" && section === "Meu plano" ? "is-plan" : ""}`} aria-label="Perfil e configurações da conta">''', 1)

          s = s.replace(
          '''                  subtitle={sectionMeta[section].subtitle}\n                />''',
          '''                  subtitle={billingMode === "saas" && section === "Meu plano"\n                    ? "Gerencie sua assinatura, ciclos de faturamento e faturas da empresa."\n                    : sectionMeta[section].subtitle}\n                />''', 1)

          old_plan = '''                {section === "Meu plano" && (\n                  <div className="ws-account-content-stack">\n                    <div className="ws-account-plan">\n                      <div><span>Plano atual</span><strong>{planLabel}</strong></div>\n                      <span className="ws-account-status">Ativo</span>\n                    </div>\n                    <div className="ws-account-grid">\n                      <TextCard title="Emissor fiscal">Acesso aos recursos de emissão e gestão fiscal da organização.</TextCard>\n                      <TextCard title="Documentos">Centralização dos documentos e informações vinculadas à conta.</TextCard>\n                    </div>\n                  </div>\n                )}'''
          new_plan = '''                {section === "Meu plano" && (\n                  billingMode === "saas" ? (\n                    <SaasPlanPanel\n                      planLabel={planLabel}\n                      organizationName={organizationName}\n                      organizationTaxId={organizationTaxId}\n                    />\n                  ) : (\n                    <div className="ws-account-content-stack">\n                      <div className="ws-account-plan">\n                        <div><span>Plano atual</span><strong>{planLabel}</strong></div>\n                        <span className="ws-account-status">Ativo</span>\n                      </div>\n                      <div className="ws-account-grid">\n                        <TextCard title="Emissor fiscal">Acesso aos recursos de emissão e gestão fiscal da organização.</TextCard>\n                        <TextCard title="Documentos">Centralização dos documentos e informações vinculadas à conta.</TextCard>\n                      </div>\n                    </div>\n                  )\n                )}'''
          assert old_plan in s, 'Meu plano block not found'
          s = s.replace(old_plan, new_plan, 1)

          marker = '''function SectionHeader({ eyebrow, title, subtitle }: { eyebrow: string; title: string; subtitle: string }) {'''
          panel = r'''function SaasPlanPanel({
  planLabel,
  organizationName,
  organizationTaxId,
}: {
  planLabel: string;
  organizationName?: string | null;
  organizationTaxId?: string | null;
}) {
  const cycle = useMemo(() => {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const fmt = (date: Date) => new Intl.DateTimeFormat('pt-BR').format(date);
    const month = new Intl.DateTimeFormat('pt-BR', { month: 'short', year: 'numeric' })
      .format(now)
      .replace('.', '')
      .replace(/^./, char => char.toUpperCase());
    return { start: fmt(start), end: fmt(end), month };
  }, []);

  const company = organizationName || 'Empresa não identificada';
  const taxId = organizationTaxId || 'CNPJ não informado';

  return (
    <div className="ws-plan-stack">
      <section className="ws-plan-card ws-plan-overview">
        <div className="ws-plan-overview-main">
          <div className="ws-plan-title-row">
            <h4>{planLabel || 'Plano fiscal'}</h4>
            <span className="ws-plan-badge ws-plan-badge-active">Assinatura ativa</span>
          </div>
          <p>Plano vinculado ao emissor fiscal desta empresa.</p>
          <div className="ws-plan-company">
            <span>Empresa vinculada</span>
            <strong>{company}</strong>
            <small>{taxId}</small>
          </div>
        </div>
        <div className="ws-plan-overview-meta">
          <div><span>Ciclo de cobrança</span><strong>Mensal</strong></div>
          <div><span>Valor do plano</span><strong>—</strong><small>Será exibido após a integração de cobrança.</small></div>
        </div>
      </section>

      <section className="ws-plan-card ws-plan-cycle">
        <div className="ws-plan-cycle-top">
          <div>
            <span className="ws-plan-eyebrow">Ciclo atual</span>
            <strong>Período</strong>
            <h4>{cycle.start} a {cycle.end}</h4>
            <p>Este período ainda está em andamento. A fatura será liberada para pagamento somente após o fechamento.</p>
          </div>
          <span className="ws-plan-badge ws-plan-badge-open">Em aberto</span>
        </div>
        <div className="ws-plan-flow-note">
          <span className="ws-plan-info-dot">i</span>
          <p><strong>Como funciona:</strong> a fatura do mês permanece em aberto durante o período. Após o fechamento do ciclo, o valor é consolidado e liberado para pagamento.</p>
        </div>
      </section>

      <div className="ws-plan-metrics">
        <div className="ws-plan-metric"><span>Próximo fechamento</span><strong>{cycle.end}</strong></div>
        <div className="ws-plan-metric"><span>Próxima cobrança estimada</span><strong>—</strong></div>
        <div className="ws-plan-metric"><span>Renovação automática</span><strong>Não configurada</strong></div>
        <div className="ws-plan-metric"><span>Forma de cobrança</span><strong>Pós-paga</strong><small>Pagamento após o fechamento.</small></div>
      </div>

      <section className="ws-plan-card ws-plan-invoices">
        <div className="ws-plan-section-head">
          <div><h4>Faturas</h4><p>Acompanhe o histórico de faturas da sua assinatura.</p></div>
          <button type="button" disabled>Ver todas as faturas</button>
        </div>
        <div className="ws-plan-table-wrap">
          <table className="ws-plan-table">
            <thead><tr><th>Mês/Ano</th><th>Período</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead>
            <tbody>
              <tr>
                <td>{cycle.month}</td>
                <td>{cycle.start} a {cycle.end}</td>
                <td>—</td>
                <td><span className="ws-plan-status is-open"><i />Em aberto</span></td>
                <td><span className="ws-plan-action-muted">Disponível após fechamento</span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div className="ws-plan-empty-history">Nenhuma fatura fechada disponível ainda.</div>
        <div className="ws-plan-flow-note is-bottom">
          <span className="ws-plan-info-dot">i</span>
          <p><strong>Fluxo de cobrança:</strong> durante o período a fatura fica em aberto. Depois do fechamento, ela será gerada e liberada para pagamento em uma página de checkout separada.</p>
        </div>
      </section>

      <section className="ws-plan-management">
        <h4>Gestão da assinatura</h4>
        <div className="ws-plan-management-grid">
          <button type="button"><span>Dados de cobrança</span><small>Dados da empresa usados nas futuras faturas.</small><b>›</b></button>
          <button type="button"><span>Renovação automática</span><small>Gerencie a renovação quando a cobrança for ativada.</small><b>›</b></button>
          <button type="button"><span>Precisa de ajuda?</span><small>Acesse o suporte para dúvidas sobre assinatura.</small><b>›</b></button>
        </div>
      </section>
    </div>
  );
}

'''
          assert marker in s, 'SectionHeader marker not found'
          s = s.replace(marker, panel + marker, 1)

          css_marker = '''  .ws-account-danger { padding:14px; background:#f1e7e7; border-color:#dbcaca; }'''
          css = r'''  .ws-account-drawer.is-plan { width:min(980px,100vw); }
  .ws-account-drawer.is-plan .ws-account-body { grid-template-columns:184px minmax(0,1fr); }
  .ws-account-drawer.is-plan .ws-account-content { padding:22px 24px 26px; }
  .ws-account-drawer.is-plan .ws-account-section-head { margin-bottom:16px; }

  .ws-plan-stack { display:grid; gap:10px; }
  .ws-plan-card { border:1px solid #d2d7dc; border-radius:7px; background:#eef1f3; overflow:hidden; }
  .ws-plan-overview { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; padding:16px; }
  .ws-plan-title-row { display:flex; flex-wrap:wrap; align-items:center; gap:9px; }
  .ws-plan-title-row h4,
  .ws-plan-cycle h4,
  .ws-plan-section-head h4,
  .ws-plan-management h4 { margin:0; color:#111827 !important; font-size:15px !important; font-weight:600 !important; line-height:1.25 !important; }
  .ws-plan-overview-main > p { margin:4px 0 13px; color:#667085 !important; font-size:11px !important; line-height:1.45 !important; }
  .ws-plan-company { display:grid; gap:2px; }
  .ws-plan-company span,
  .ws-plan-overview-meta span,
  .ws-plan-metric span,
  .ws-plan-eyebrow { color:#667085 !important; font-size:10px !important; font-weight:600 !important; }
  .ws-plan-company strong { color:#253247 !important; font-size:13px !important; font-weight:600 !important; }
  .ws-plan-company small,
  .ws-plan-overview-meta small,
  .ws-plan-metric small { color:#7a8492 !important; font-size:10px !important; font-weight:400 !important; }
  .ws-plan-overview-meta { display:grid; grid-template-columns:1fr 1fr; align-content:start; border-left:1px solid #d2d7dc; }
  .ws-plan-overview-meta > div { display:grid; gap:4px; align-content:start; padding:2px 0 2px 15px; }
  .ws-plan-overview-meta > div + div { border-left:1px solid #d2d7dc; }
  .ws-plan-overview-meta strong { color:#172033 !important; font-size:14px !important; font-weight:600 !important; }

  .ws-plan-badge { display:inline-flex; min-height:23px; align-items:center; justify-content:center; padding:0 8px; border-radius:999px; font-size:10px !important; font-weight:600 !important; white-space:nowrap; }
  .ws-plan-badge-active { border:1px solid #cce6d4; background:#e1f3e7; color:#31744a !important; }
  .ws-plan-badge-open { border:1px solid #cad9e9; background:#e5edf6; color:#345b82 !important; }

  .ws-plan-cycle { padding:15px; }
  .ws-plan-cycle-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .ws-plan-cycle-top > div { min-width:0; }
  .ws-plan-cycle-top strong { display:block; margin:5px 0 2px; color:#667085 !important; font-size:10px !important; font-weight:500 !important; }
  .ws-plan-cycle h4 { font-size:14px !important; }
  .ws-plan-cycle-top p { margin:5px 0 0; color:#667085 !important; font-size:11px !important; line-height:1.45 !important; }
  .ws-plan-flow-note { display:flex; align-items:flex-start; gap:8px; margin-top:12px; border:1px solid #cfdae5; border-radius:6px; background:#e4ebf1; padding:8px 10px; }
  .ws-plan-flow-note p { margin:0; color:#506176 !important; font-size:10px !important; line-height:1.45 !important; }
  .ws-plan-flow-note p strong { color:#34495f !important; font-weight:600 !important; }
  .ws-plan-info-dot { display:grid; width:16px; height:16px; flex:0 0 auto; place-items:center; border:1px solid #7c91a8; border-radius:50%; color:#536b84 !important; font-size:9px !important; font-weight:700 !important; }

  .ws-plan-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .ws-plan-metric { min-height:69px; display:grid; align-content:start; gap:5px; border:1px solid #d2d7dc; border-radius:7px; background:#e9ecef; padding:11px; }
  .ws-plan-metric strong { color:#253247 !important; font-size:12px !important; font-weight:600 !important; line-height:1.3 !important; }

  .ws-plan-invoices { padding:0; }
  .ws-plan-section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:13px 14px 10px; }
  .ws-plan-section-head p { margin:3px 0 0; color:#667085 !important; font-size:10px !important; }
  .ws-plan-section-head button { border:0; background:transparent; padding:2px 0; color:#697586 !important; font-size:10px !important; font-weight:500 !important; opacity:.65; }
  .ws-plan-table-wrap { overflow-x:auto; }
  .ws-plan-table { width:100%; border-collapse:collapse; min-width:600px; }
  .ws-plan-table th { background:#dde2e6; padding:7px 10px; color:#667085 !important; font-size:9px !important; font-weight:600 !important; text-align:left; }
  .ws-plan-table td { border-top:1px solid #d5dbe0; padding:8px 10px; color:#344054 !important; font-size:10px !important; font-weight:400 !important; vertical-align:middle; }
  .ws-plan-table td:first-child { font-weight:600 !important; color:#253247 !important; }
  .ws-plan-status { display:inline-flex; min-height:22px; align-items:center; gap:5px; border-radius:999px; padding:0 7px; font-size:9px !important; font-weight:600 !important; }
  .ws-plan-status i { width:6px; height:6px; border-radius:50%; background:#70849a; }
  .ws-plan-status.is-open { background:#e5edf6; color:#345b82 !important; }
  .ws-plan-action-muted { color:#85909d !important; font-size:9px !important; }
  .ws-plan-empty-history { border-top:1px solid #d5dbe0; padding:9px 14px; color:#7a8492 !important; font-size:10px !important; }
  .ws-plan-flow-note.is-bottom { margin:0 10px 10px; }

  .ws-plan-management > h4 { margin:2px 0 8px; font-size:13px !important; }
  .ws-plan-management-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .ws-plan-management-grid button { position:relative; display:grid; min-height:67px; align-content:center; gap:3px; border:1px solid #d2d7dc; border-radius:7px; background:#e9ecef; padding:10px 28px 10px 12px; text-align:left; cursor:pointer; }
  .ws-plan-management-grid button:hover { background:#e2e6ea; }
  .ws-plan-management-grid span { color:#253247 !important; font-size:11px !important; font-weight:600 !important; }
  .ws-plan-management-grid small { color:#667085 !important; font-size:9px !important; font-weight:400 !important; line-height:1.4 !important; }
  .ws-plan-management-grid b { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#667085 !important; font-size:18px !important; font-weight:400 !important; }

'''
          assert css_marker in s, 'CSS marker not found'
          s = s.replace(css_marker, css + css_marker, 1)

          mobile_marker = '''    .ws-account-footer {\n      flex:0 0 auto;'''
          mobile_css = r'''    .ws-account-drawer.is-plan .ws-account-body { display:flex; }
    .ws-account-drawer.is-plan .ws-account-content { padding:16px 12px 24px; }
    .ws-plan-stack { gap:8px; }
    .ws-plan-overview { grid-template-columns:1fr; gap:12px; padding:13px; }
    .ws-plan-overview-meta { grid-template-columns:1fr 1fr; border-left:0; border-top:1px solid #d2d7dc; padding-top:10px; }
    .ws-plan-overview-meta > div { padding-left:0; }
    .ws-plan-overview-meta > div + div { padding-left:10px; }
    .ws-plan-cycle { padding:12px; }
    .ws-plan-cycle-top { gap:10px; }
    .ws-plan-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .ws-plan-metric { min-height:62px; padding:10px; }
    .ws-plan-management-grid { grid-template-columns:1fr; gap:7px; }
    .ws-plan-management-grid button { min-height:58px; }
    .ws-plan-table-wrap { margin:0; }
    .ws-plan-flow-note.is-bottom { margin:0 8px 8px; }

'''
          assert mobile_marker in s, 'mobile CSS marker not found'
          s = s.replace(mobile_marker, mobile_css + mobile_marker, 1)

          p.write_text(s)

          p = Path('src/pages/SaasApp.tsx')
          s = p.read_text()
          needle = '''              notifications={accountNotifications}\n              usageRows={[\n                { label: 'Notas emitidas', value: String(emissions.length) },'''
          repl = '''              notifications={accountNotifications}\n              billingMode="saas"\n              organizationName={organization?.name || null}\n              organizationTaxId={profile?.tax_id ? formatCnpj(profile.tax_id) : null}\n              usageRows={[\n                { label: 'Notas emitidas', value: String(emissions.length) },'''
          assert needle in s, 'SaaS AccountDrawer call not found'
          s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/account/AccountDrawer.tsx src/pages/SaasApp.tsx
          git commit -m "feat(saas): redesign only Meu plano billing tab"
          git push
