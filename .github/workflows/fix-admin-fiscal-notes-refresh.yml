name: Fix admin fiscal notes refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-fiscal-notes-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fiscal notes page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminFiscalNotes.tsx')
          text = p.read_text()

          marker = '  useEffect(() => setPage(1), [year, month, periodMode, customStart, customEnd, filter, query]);\n'
          block = '''\n  useEffect(() => {\n    if (!company) return;\n    const refresh = () => { void loadDocs(company).catch(e => setError(e instanceof Error ? e.message : String(e))); };\n    const timer = window.setInterval(refresh, 15000);\n    const onFocus = () => refresh();\n    window.addEventListener("focus", onFocus);\n    return () => {\n      window.clearInterval(timer);\n      window.removeEventListener("focus", onFocus);\n    };\n  }, [company?.id]);\n'''
          if block.strip() not in text:
              if marker not in text:
                  raise SystemExit('auto-refresh marker not found')
              text = text.replace(marker, marker + block, 1)

          sales_marker = '      const loaded = await loadDocs(company);\n'
          sales_block = '''      if (String(company.uf || "").toUpperCase() === "AL" && (company.ambiente_padrao || "producao") === "producao") {\n        const { error: salesError } = await supabase.functions.invoke("fiscal-sales-sync", { body: { company_id: company.id } });\n        if (salesError) console.warn("fiscal-sales-sync", salesError.message);\n      }\n      const loaded = await loadDocs(company);\n'''
          if 'console.warn("fiscal-sales-sync"' not in text:
              if sales_marker not in text:
                  raise SystemExit('sales sync marker not found')
              text = text.replace(sales_marker, sales_block, 1)

          p.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ws-fiscal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AdminFiscalNotes.tsx
          git commit -m "fix: refresh fiscal notes and sales automatically"
          git push
