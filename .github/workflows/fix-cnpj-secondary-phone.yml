name: Fix CNPJ secondary phone mapping

on:
  push:
    paths:
      - '.github/workflows/fix-cnpj-secondary-phone.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep secondary phone out of WhatsApp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/saas/SaasCadastros.tsx')
          s=p.read_text()
          s=s.replace("      'phone',\n      'mobile',\n      'postal_code',", "      'phone',\n      'postal_code',", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/saas/SaasCadastros.tsx
          git commit -m "fix(saas): do not infer WhatsApp from secondary phone"
          git push
