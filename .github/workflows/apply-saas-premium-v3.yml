name: Apply SaaS premium redesign v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-saas-premium-v3.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire premium products, styling and button hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app=Path('src/pages/SaasApp.tsx')
          s=app.read_text()
          if 'SaasProductsPremium' not in s:
              s=s.replace('import SaasDashboard from "@/components/saas/SaasDashboard";','import SaasDashboard from "@/components/saas/SaasDashboard";\nimport SaasProductsPremium from "@/components/saas/SaasProductsPremium";')
          if 'saas-premium-v3.css' not in s:
              s=s.replace('import "@/styles/saas-admin-light.css";','import "@/styles/saas-admin-light.css";\nimport "@/styles/saas-premium-v3.css";')
          old='else if (cadastroSections.has(active)) content = <SaasCadastros organizationId={organization?.id || null} section={active as CadastroSection} />;'
          new='else if (active === "Produtos") content = <SaasProductsPremium organizationId={organization?.id || null} />;\n  else if (cadastroSections.has(active)) content = <SaasCadastros organizationId={organization?.id || null} section={active as CadastroSection} />;'
          if old in s:s=s.replace(old,new,1)
          app.write_text(s)

          dash=Path('src/components/saas/SaasDashboard.tsx')
          s=dash.read_text()
          old='const authorized=emissions.filter(x=>x.status==="authorized"),pending=emissions.filter(x=>["draft","validated"].includes(x.status)),cancelled=emissions.filter(x=>x.status==="cancelled"),rejected=emissions.filter(x=>x.status==="rejected"),total=authorized.reduce((a,x)=>a+Number(x.total||0),0),ticket=authorized.length?total/authorized.length:0;'
          new='const isAuthorized=(x:any)=>x?.status==="authorized"&&x?.status!=="cancelled"&&!x?.cancelled_at&&String(x?.response?.cStat||x?.response?.protocol?.cStat||x?.response?.status_code||"100")==="100";\n const authorized=emissions.filter(isAuthorized),pending=emissions.filter(x=>["draft","validated","processing"].includes(x.status)),cancelled=emissions.filter(x=>x.status==="cancelled"||!!x.cancelled_at),rejected=emissions.filter(x=>x.status==="rejected"||x.status==="error"),total=authorized.reduce((a,x)=>a+Number(x.total||0),0),ticket=authorized.length?total/authorized.length:0;'
          if old in s:s=s.replace(old,new,1)
          dash.write_text(s)

          emission=Path('src/components/saas/SaasEmission.tsx')
          s=emission.read_text()
          s=s.replace('const inputClass="mt-2 h-11 !border-[#cbd3dc] !bg-white !text-[#10203e] dark:!bg-white dark:!text-[#10203e]";','const inputClass="mt-2 h-11 !border-[#d7dde5] !bg-white !text-[#10203e] dark:!bg-white dark:!text-[#10203e]";',1)
          s=s.replace('const panel="rounded-lg border border-[#cfd6df] bg-white p-5 md:p-6";','const panel="rounded-[10px] border border-[#dbe1e8] bg-white p-5 md:p-6";',1)
          old='const actions=(name:string,payload:any,extra:any={},transport=false)=><div className="flex flex-wrap gap-3"><Button variant="outline" disabled={busy||(transport&&!transportCanTransmit)} onClick={()=>invoke(name,{action:"preview",data:payload,...extra})}>{busy?"Processando...":"Gerar prévia XML"}</Button><Button disabled={busy||(transport&&!transportCanTransmit)} onClick={()=>invoke(name,{action:"issue",data:payload,...extra})} className={environment==="production"?"!bg-red-700 !border-red-700 hover:!bg-red-800":""}>{busy?"Processando...":environment==="production"?"Emitir em PRODUÇÃO":"Transmitir em homologação"}</Button></div>;'
          new='const actions=(name:string,payload:any,extra:any={},transport=false)=><div className="saas-emission-actions"><Button variant="outline" className="saas-action-secondary" disabled={busy||(transport&&!transportCanTransmit)} onClick={()=>invoke(name,{action:"preview",data:payload,...extra})}>{busy?"Processando...":"Conferir documento"}</Button><Button disabled={busy||(transport&&!transportCanTransmit)} onClick={()=>invoke(name,{action:"issue",data:payload,...extra})} className={environment==="production"?"saas-action-danger":"saas-action-primary"}>{busy?"Processando...":environment==="production"?"Emitir em produção":"Transmitir para homologação"}</Button></div>;'
          if old in s:s=s.replace(old,new,1)
          emission.write_text(s)
          PY
      - name: Install printable fiscal barcode and QR dependencies
        run: |
          npm install jsbarcode@^3.12.1 qrcode@^1.5.4
          npm install -D @types/jsbarcode@^3.11.4 @types/qrcode@^1.5.5
      - name: Validate production build
        run: npm run build
      - name: Commit redesign
        run: |
          git config user.name ws-ui-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/SaasApp.tsx src/components/saas/SaasDashboard.tsx src/components/saas/SaasEmission.tsx package.json package-lock.json
          git diff --cached --quiet || (git commit -m 'feat: apply premium SaaS fiscal redesign' && git push)
# rerun: 2026-09-02T04:52Z
