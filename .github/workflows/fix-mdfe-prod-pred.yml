name: Fix MDFe prodPred
on:
  push:
    paths:
      - '.github/workflows/fix-mdfe-prod-pred.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch MDF-e builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          needle='contratanteXml=(tpEmit==="1"||tpEmit==="3")&&contratanteDoc?`<infContratante>${contratanteDoc.length===14?`<CNPJ>${contratanteDoc}</CNPJ>`:`<CPF>${contratanteDoc}</CPF>`}</infContratante>`:"";const xml='
          repl='contratanteXml=(tpEmit==="1"||tpEmit==="3")&&contratanteDoc?`<infContratante>${contratanteDoc.length===14?`<CNPJ>${contratanteDoc}</CNPJ>`:`<CPF>${contratanteDoc}</CPF>`}</infContratante>`:"";const needsProd=tpEmit==="1"||tpEmit==="3",cepCarrega=digits(raw.cepCarrega||p.postal_code),cepDescarga=digits(raw.cepDescarga||(tpAmb==="2"?"57580970":"")),lotacaoXml=keys.length===1?`<infLotacao><infLocalCarrega><CEP>${cepCarrega}</CEP></infLocalCarrega><infLocalDescarrega><CEP>${cepDescarga}</CEP></infLocalDescarrega></infLotacao>`:"",prodPredXml=needsProd?`<prodPred><tpCarga>${esc(raw.tpCarga||"05")}</tpCarga><xProd>${esc(raw.xProd||"CARGA GERAL")}</xProd>${lotacaoXml}</prodPred>`:"";const xml='
          if needle not in s:
              raise SystemExit('needle 1 not found')
          s=s.replace(needle,repl,1)
          needle2='</infMunDescarga></infDoc>${segXml}<tot>'
          repl2='</infMunDescarga></infDoc>${segXml}${prodPredXml}<tot>'
          if needle2 not in s:
              raise SystemExit('needle 2 not found')
          s=s.replace(needle2,repl2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name ws-fiscal-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saas-mdfe-issue/index.ts
          git commit -m 'fix: include MDF-e predominant product and lotation' || exit 0
          git push
