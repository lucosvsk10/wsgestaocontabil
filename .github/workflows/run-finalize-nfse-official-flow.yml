name: Finalize official NFS-e flow
on:
  push:
    paths:
      - 'scripts/finalize_nfse_official_flow.py'
      - '.github/workflows/run-finalize-nfse-official-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/finalize_nfse_official_flow.py
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - name: Commit final NFS-e flow
        run: |
          git config user.name ws-fiscal-bot
          git config user.email ws-fiscal-bot@users.noreply.github.com
          git add src/components/saas/NfseOfficialFlow.tsx src/components/saas/SaasEmission.tsx supabase/functions/saas-nfse-issue/index.ts
          git commit -m "fix: finalize official NFS-e flow"
          git push
