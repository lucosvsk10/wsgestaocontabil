name: Deploy hardened MDF-e
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mdfe-fix.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
      - name: Deploy SaaS MDF-e function
        run: npx --yes supabase@latest functions deploy saas-mdfe-issue --project-ref "$SUPABASE_PROJECT_REF"
