name: Deploy fiscal recovery

on:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Deploy recovery, backfill and bulk download functions
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)

      - name: Setup Supabase CLI
        run: npx --yes supabase@latest --version

      - name: Deploy fiscal-document-recover
        run: npx --yes supabase@latest functions deploy fiscal-document-recover --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy purchase XML backfill
        if: ${{ inputs.deploy_all }}
        run: npx --yes supabase@latest functions deploy fiscal-purchases-xml-backfill --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy sales XML backfill
        if: ${{ inputs.deploy_all }}
        run: npx --yes supabase@latest functions deploy fiscal-sales-xml-backfill --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy bulk download
        if: ${{ inputs.deploy_all }}
        run: npx --yes supabase@latest functions deploy fiscal-bulk-download --project-ref "$SUPABASE_PROJECT_REF"
