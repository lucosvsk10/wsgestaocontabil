name: Fix MDFe supl before signature
on:
  push:
    paths:
      - '.github/workflows/fix-mdfe-supl-before-signature.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch signature placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          start=s.index('function sign(xml:string,key:string,cert:string){')
          end=s.index('\nasync function loadCertificate', start)
          new='''function sign(xml:string,key:string,cert:string){const s=new SignedXml({privateKey:key,publicCert:cert,canonicalizationAlgorithm:"http://www.w3.org/TR/2001/REC-xml-c14n-20010315",signatureAlgorithm:"http://www.w3.org/2000/09/xmldsig#rsa-sha1"});s.addReference({xpath:"//*[local-name(.)='infMDFe']",transforms:["http://www.w3.org/2000/09/xmldsig#enveloped-signature","http://www.w3.org/TR/2001/REC-xml-c14n-20010315"],digestAlgorithm:"http://www.w3.org/2000/09/xmldsig#sha1"});s.getKeyInfoContent=SignedXml.getKeyInfoContent;s.computeSignature(xml,{location:{reference:"//*[local-name(.)='infMDFeSupl']",action:"after"}});const signed=s.getSignedXml();const iInf=signed.indexOf("<infMDFe "),iSupl=signed.indexOf("<infMDFeSupl>"),iSig=signed.indexOf("<Signature");if(iInf<0||iSupl<iInf||iSig<iSupl)throw new Error("Ordem XML MDF-e inválida: esperado infMDFe, infMDFeSupl, Signature");return signed}'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts
          git commit -m "fix: place MDF-e supplemental block before signature"
          git push
