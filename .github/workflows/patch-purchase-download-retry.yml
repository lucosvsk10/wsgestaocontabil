name: Patch purchase XML download retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-purchase-download-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/fiscal-purchases-xml-backfill/index.ts')
          s=p.read_text()
          old='''async function download(pfx:string,pass:string,key:string){const r=await fetch("https://ws-svrs-consit.vercel.app/api/download",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({certificate_base64:pfx,certificate_password:pass,access_key:key}),signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(`bridge_http_${r.status}`);const o=await r.json().catch(()=>({})) as any;const all=String(o?.body_text||o?.body||"");const m=all.match(/var\\s+stringJson\\s*=\\s*(\\{[\\s\\S]*?\\})\\s*;/);if(!m)throw Error("xml_payload_not_found");let data:any;try{data=JSON.parse(m[1])}catch{throw Error("xml_payload_invalid_json")};const xml=String(data?.xml||"");if(!/<(?:nfeProc|procNFe|NFe)\\b/i.test(xml)||xml.length<1000)throw Error("xml_not_returned");return xml}'''
          new='''async function download(pfx:string,pass:string,key:string){let last="xml_download_failed";for(let attempt=0;attempt<3;attempt++){try{const r=await fetch("https://ws-svrs-consit.vercel.app/api/download",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({certificate_base64:pfx,certificate_password:pass,access_key:key}),signal:AbortSignal.timeout(35000)});const o=await r.json().catch(()=>({})) as any;if(!r.ok){last=`bridge_http_${r.status}:${String(o?.error||o?.message||"").slice(0,120)}`;if(r.status>=500&&attempt<2){await sleep(1800*(attempt+1));continue}throw Error(last)}const all=String(o?.body_text||o?.body||"");const m=all.match(/var\\s+stringJson\\s*=\\s*(\\{[\\s\\S]*?\\})\\s*;/);if(!m){if(/CNPJ base do certificado digital[^<]*difere/i.test(all))throw Error("certificate_not_involved");last="xml_payload_not_found";if(attempt<2){await sleep(1800*(attempt+1));continue}throw Error(last)}let data:any;try{data=JSON.parse(m[1])}catch{last="xml_payload_invalid_json";if(attempt<2){await sleep(1800*(attempt+1));continue}throw Error(last)}const xml=String(data?.xml||"");if(!/<(?:nfeProc|procNFe|NFe)\\b/i.test(xml)||xml.length<1000){last="xml_not_returned";if(attempt<2){await sleep(1800*(attempt+1));continue}throw Error(last)}return xml}catch(e){last=e instanceof Error?e.message:String(e);if(/certificate_not_involved/.test(last))throw Error(last);if(attempt<2&&(/bridge_http_5\\d\\d|timeout|xml_payload_not_found|xml_payload_invalid_json|xml_not_returned/i.test(last))){await sleep(1800*(attempt+1));continue}throw Error(last)}}throw Error(last)}'''
          if old not in s: raise SystemExit('download function marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/fiscal-purchases-xml-backfill/index.ts
          git diff --cached --quiet || (git commit -m 'fix: retry transient purchase XML bridge failures' && git push)
