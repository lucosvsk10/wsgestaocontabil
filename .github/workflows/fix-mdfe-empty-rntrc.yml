name: Fix MDFe empty RNTRC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mdfe-empty-rntrc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Omit empty RNTRC tag
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/saas-mdfe-issue/index.ts')
          s=p.read_text()
          old='<infANTT><RNTRC>${digits(raw.rntrc)}</RNTRC>${contratanteXml}'
          new='<infANTT>${rntrcXml}${contratanteXml}'
          if old not in s: raise SystemExit('RNTRC anchor not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit patch
        run: |
          git config user.name ws-fiscal-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/saas-mdfe-issue/index.ts
          git diff --cached --quiet || (git commit -m 'fix: omit empty RNTRC tag in MDF-e' && git push)
