name: Apply SaaS NFS-e model update

on:
  push:
    paths:
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize current setup indentation
        run: |
          python3 -c "from pathlib import Path; p=Path('src/pages/SaasApp.tsx'); s=p.read_text(); s=s.replace('      profile?.legal_name &&\\n      profile?.state_registration &&\\n      profile?.city_ibge_code &&','    profile?.legal_name &&\\n    profile?.state_registration &&\\n    profile?.city_ibge_code &&'); p.write_text(s)"
      - name: Apply scoped SaaS NFS-e patch
        run: python3 .github/scripts/saas_nfse_model_patch.py
      - name: Commit scoped update
        run: |
          git config user.name "WS SaaS automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(saas): align NFS-e flow with national model"
          git push origin HEAD:main
