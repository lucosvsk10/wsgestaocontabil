name: Apply SaaS NFS-e model update

on:
  push:
    paths:
      - '.github/workflows/saas-nfse-model-update.yml'
      - '.github/scripts/saas_nfse_model_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align current SaaS setup target
        run: |
          python3 -c "from pathlib import Path; p=Path('.github/scripts/saas_nfse_model_patch.py'); s=p.read_text(); s=s.replace(chr(34)+'    profile?.legal_name &&\\n    profile?.state_registration &&\\n    profile?.city_ibge_code &&'+chr(34), chr(34)+'      profile?.legal_name &&\\n      profile?.state_registration &&\\n      profile?.city_ibge_code &&'+chr(34)); s=s.replace(chr(34)+'    profile?.legal_name &&\\n    profile?.city_ibge_code &&'+chr(34), chr(34)+'      profile?.legal_name &&\\n      profile?.city_ibge_code &&'+chr(34)); p.write_text(s)"
      - name: Patch SaaS NFS-e only
        run: python3 .github/scripts/saas_nfse_model_patch.py
      - name: Commit scoped update
        run: |
          git config user.name "WS SaaS automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(saas): align NFS-e flow with national model"
          git push origin HEAD:main
