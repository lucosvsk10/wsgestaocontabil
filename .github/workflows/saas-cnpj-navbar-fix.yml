name: Apply SaaS CNPJ navbar fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/saas-cnpj-navbar-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        run: |
          cat >> src/styles/saas-mobile-polish.css <<'EOF'

/* Dedicated company CNPJ line — must stay visible in the topbar. */
.saas-admin-light .saas-company-context {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
}
.saas-admin-light .saas-company-tax-id {
  display: block !important;
  position: relative !important;
  z-index: 5 !important;
  width: 100% !important;
  max-height: none !important;
  margin: 2px 0 0 !important;
  padding: 0 !important;
  visibility: visible !important;
  opacity: 1 !important;
  overflow: hidden !important;
  color: #94a3b8 !important;
  font-size: 9px !important;
  font-weight: 400 !important;
  line-height: 1.05 !important;
  text-align: center !important;
  text-overflow: ellipsis !important;
  white-space: nowrap !important;
}
@media (max-width: 720px) {
  .saas-admin-light .saas-company-context {
    height: 52px !important;
    min-height: 52px !important;
    overflow: visible !important;
  }
  .saas-admin-light .saas-company-tax-id {
    display: block !important;
    font-size: 8px !important;
    color: #a8b3c2 !important;
  }
}
EOF
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/saas-mobile-polish.css
          git commit -m 'fix(saas): force CNPJ visible in navbar'
          git push
