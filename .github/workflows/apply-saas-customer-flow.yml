name: Apply SaaS customer flow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-saas-customer-flow.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/saas/SaasCadastros.tsx')
          s = p.read_text()

          anchor = "import { supabase } from '@/integrations/supabase/client';\n"
          imp = "import SaasCustomerEditor from '@/components/saas/SaasCustomerEditor';\n"
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)

          old_layout = '      <div className="saas-register-layout">'
          new_layout = "      <div className={`saas-register-layout ${section === 'Clientes' && form ? 'is-customer-editing' : ''}`}>"
          if old_layout in s:
              s = s.replace(old_layout, new_layout, 1)
          elif 'is-customer-editing' not in s:
              raise SystemExit('layout anchor not found')

          old_editor = """                {isCatalog ? (
                  <CatalogEditor section={section} form={form} set={set} />
                ) : (
                  <PartyEditor section={section} form={form} set={set} />
                )}"""
          new_editor = """                {isCatalog ? (
                  <CatalogEditor section={section} form={form} set={set} />
                ) : section === 'Clientes' ? (
                  <SaasCustomerEditor form={form} set={set} />
                ) : (
                  <PartyEditor section={section} form={form} set={set} />
                )}"""
          if old_editor in s:
              s = s.replace(old_editor, new_editor, 1)
          elif '<SaasCustomerEditor form={form} set={set} />' not in s:
              raise SystemExit('editor anchor not found')

          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/saas/SaasCadastros.tsx
          git commit -m 'feat(saas): activate visual customer creation flow'
          git push
