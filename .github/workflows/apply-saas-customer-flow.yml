name: Apply SaaS customer flow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-saas-customer-flow.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer editor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/saas/SaasCadastros.tsx')
          s = p.read_text()

          anchor = "import { supabase } from '@/integrations/supabase/client';\n"
          imp = "import SaasCustomerEditor from '@/components/saas/SaasCustomerEditor';\n"
          if imp not in s:
              assert anchor in s, 'import anchor not found'
              s = s.replace(anchor, anchor + imp, 1)

          old_layout = '<div className="saas-register-layout">'
          new_layout = "<div className={`saas-register-layout ${section === 'Clientes' && form ? 'is-customer-editing' : ''}`}>"
          if old_layout in s:
              s = s.replace(old_layout, new_layout, 1)

          if '<SaasCustomerEditor form={form} set={set} />' not in s:
              pattern = r"\) : \(\s*<PartyEditor section=\{section\} form=\{form\} set=\{set\} />\s*\)\}"
              replacement = ") : section === 'Clientes' ? (\n                <SaasCustomerEditor form={form} set={set} />\n              ) : (\n                <PartyEditor section={section} form={form} set={set} />\n              )}"
              s, count = re.subn(pattern, replacement, s, count=1)
              assert count == 1, 'party editor regex did not match'

          assert 'is-customer-editing' in s
          assert '<SaasCustomerEditor form={form} set={set} />' in s
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/saas/SaasCadastros.tsx
          git commit -m 'feat(saas): activate visual customer creation flow'
          git push
