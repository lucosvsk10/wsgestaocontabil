name: Redesign SaaS issued notes

on:
  push:
    paths:
      - '.github/workflows/redesign-saas-issued-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align SaaS issued notes with ADM structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/saas/SaasIssuedNotes.tsx')
          s=p.read_text()

          # Remove technical XML KPI/banner dependency from the visible UI.
          s=s.replace(' const missingXml=authorized.filter(x=>!x.xml);\n','')

          # KPIs: mirror ADM information hierarchy.
          old='''  <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-4">\n   <Summary label="Total de notas" value={String(scoped.length)}/>\n   <Summary label="Autorizadas" value={String(authorized.length)} detail={scoped.length?`${Math.round(authorized.length/scoped.length*100)}% do período`:"0% do período"}/>\n   <Summary label="Em andamento" value={String(pending.length)} detail="Rascunhos e processamentos"/>\n   <Summary label="Faturamento" value={money(revenue)} detail={`${authorized.length} documento(s) autorizado(s)`}/>\n  </div>\n\n  {missingXml.length>0&&<div className="flex flex-wrap items-center justify-between gap-3 rounded-md border border-[#eadfce] bg-[#fffaf2] px-4 py-3"><div><p className="text-[9px] font-semibold uppercase tracking-[.13em] text-[#8a6a3a]">Recuperação automática</p><p className="mt-1 text-sm font-medium text-[#b46b00]">{missingXml.length} documento{missingXml.length===1?"":"s"} aguardando XML</p></div><span className="text-xs text-[#8a7559]">Os arquivos serão vinculados quando estiverem disponíveis.</span></div>}\n'''
          new='''  <div className="grid gap-2 md:grid-cols-4">\n   <Summary label="Total notas" value={String(scoped.length)}/>\n   <Summary label="Autorizadas" value={String(authorized.length)}/>\n   <Summary label="Canceladas" value={String(scoped.filter(x=>x.status==="cancelled").length)}/>\n   <Summary label="Faturamento" value={money(revenue)} detail={pending.length?`${pending.length} em andamento`:undefined}/>\n  </div>\n'''
          if old not in s: raise SystemExit('KPI/banner block not found')
          s=s.replace(old,new,1)

          # Period strip visual structure: same rounded, quiet ADM hierarchy.
          s=s.replace('''  <section className="rounded-md border border-[#d9dfe6] bg-white p-4 shadow-sm">''','''  <section className="rounded-2xl bg-muted/10 px-4 py-3">''',1)
          s=s.replace('''className={`h-9 rounded-md px-3 text-xs ${month===null?"bg-white shadow-sm ring-1 ring-[#cfd7e1]":"bg-transparent text-[#667085]"}`}''','''className={`min-w-11 rounded-xl px-3 py-2 text-sm font-medium ${month===null?"bg-background shadow-sm":"text-muted-foreground hover:bg-background/70"}`}''',1)
          s=s.replace('''className={`h-9 rounded-md px-3 text-xs ${month===i?"bg-white font-semibold text-[#111827] shadow-sm ring-1 ring-[#cfd7e1]":"bg-transparent text-[#667085] hover:bg-[#f4f6f8]"}`}''','''className={`min-w-11 rounded-xl px-3 py-2 text-sm font-medium ${month===i?"bg-background shadow-sm":"text-muted-foreground hover:bg-background/70"}`}''',1)
          s=s.replace('''<div className="ml-auto flex h-9 items-center gap-2 rounded-md border border-[#d7dee6] bg-white px-3 text-xs text-[#344054]"><CalendarDays className="h-4 w-4"/>Personalizado</div>''','''<div className="ml-auto flex h-9 items-center gap-2 rounded-xl px-3 text-sm font-medium text-muted-foreground"><CalendarDays className="h-4 w-4"/>Personalizado</div>''',1)

          # Main table shell and filters: ADM-like pills instead of tabs.
          s=s.replace('''  <section className="overflow-hidden rounded-md border border-[#d7dde5] bg-white shadow-sm">''','''  <section className="overflow-hidden rounded-2xl bg-background shadow-sm ring-1 ring-black/[.04]">''',1)
          old_tabs='''   <div className="border-b border-[#dfe4ea] bg-[#fbfcfd] px-4 pt-3">\n    <div className="flex flex-wrap items-center gap-1">{tabs.map(t=><button key={t.label} onClick={()=>chooseTab(t.label)} className={`h-9 rounded-t-md px-3 text-[11px] font-medium ${tab===t.label?"bg-[#152238] text-white":"bg-transparent text-[#667085] hover:bg-[#f0f3f6]"}`}>{t.label}<span className="ml-1 opacity-75">{t.count}</span></button>)}</div>\n   </div>\n   <div className="flex flex-col gap-3 border-b border-[#dfe4ea] p-4 lg:flex-row lg:items-center">\n    <div className="relative flex-1"><Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#98a2b3]"/><input value={query} onChange={e=>{setQuery(e.target.value);setPage(1)}} placeholder="Buscar por número, chave, razão social, CNPJ, produto ou situação..." className="h-10 w-full rounded-md border border-[#d7dde5] bg-[#f9fafb] pl-10 pr-3 text-sm outline-none focus:border-[#8aa4c3]"/></div>\n    <button className="inline-flex h-10 items-center justify-center gap-2 rounded-md bg-[#152238] px-4 text-xs font-semibold text-white"><Download className="h-4 w-4"/>Download</button>\n   </div>\n'''
          new_tabs='''   <div className="flex flex-wrap items-center gap-2 px-4 py-3">{tabs.map(t=><button key={t.label} onClick={()=>chooseTab(t.label)} className={`rounded-full px-3 py-1.5 text-xs font-medium ${tab===t.label?"bg-foreground text-background shadow-sm":"bg-muted/35 text-muted-foreground hover:bg-muted/60"}`}>{t.label} <b>{t.count}</b></button>)}</div>\n   <div className="flex items-center gap-2 px-4 pb-3">\n    <div className="relative flex-1"><Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"/><input value={query} onChange={e=>{setQuery(e.target.value);setPage(1)}} placeholder="Buscar por número, chave, razão social, CNPJ, produto ou situação..." className="h-10 w-full rounded-md border-0 bg-muted/30 pl-10 pr-3 text-sm outline-none"/></div>\n    <button className="inline-flex h-10 items-center justify-center gap-2 rounded-md bg-foreground px-4 text-xs font-semibold text-background"><Download className="h-4 w-4"/>Download</button>\n   </div>\n'''
          if old_tabs not in s: raise SystemExit('tabs/search block not found')
          s=s.replace(old_tabs,new_tabs,1)

          # Remove Arquivo column from header.
          s=s.replace('''<table className="w-full min-w-[1240px] text-left"><thead><tr className="border-b border-[#d8dee6] bg-[#eef1f4]"><th className="px-4 py-3">Emissão</th><th className="px-4 py-3">Arquivo</th><th className="px-4 py-3">Nota / chave</th><th className="px-4 py-3">Destinatário / emitente</th><th className="px-4 py-3">Operação</th><th className="px-4 py-3 text-right">Valor</th><th className="px-4 py-3 text-right">Ações</th></tr></thead>''','''<table className="w-full min-w-[1000px] text-left text-sm"><thead className="bg-muted/20 text-[11px] uppercase tracking-wide text-muted-foreground"><tr><th className="px-4 py-3">Emissão</th><th className="px-4 py-3">Nota / chave</th><th className="px-4 py-3">Destinatário / emitente</th><th className="px-4 py-3">Operação</th><th className="px-4 py-3 text-right">Valor</th><th className="px-4 py-3 text-right">Ações</th></tr></thead>''',1)

          # Row styling and technical Arquivo cell removal.
          s=s.replace('''className={`cursor-pointer border-b border-[#e1e6ec] ${index%2===0?"bg-white":"bg-[#f1f4f6]"} hover:bg-[#e4eaf0]`}''','''className={`ws-zebra-row cursor-pointer transition-colors hover:bg-muted/40`}''',1)
          arquivo='''     <td className="px-4 py-3.5"><div className={`text-xs font-semibold ${item.xml?"text-emerald-600":"text-amber-600"}`}>{item.xml?"Completo":"Aguardando"}</div><div className="mt-0.5 text-[10px] text-[#7b8794]">{item.xml?"DANFE + XML":"DANFE disponível"}</div></td>\n'''
          if arquivo not in s: raise SystemExit('arquivo cell not found')
          s=s.replace(arquivo,'',1)

          # Theme-adaptive text, keep data hierarchy.
          s=s.replace('text-[#172033]','text-foreground')
          s=s.replace('text-[#7b8794]','text-muted-foreground')
          s=s.replace('text-[#98a2b3]','text-muted-foreground')
          s=s.replace('text-[#344054]','text-foreground')

          # Empty-state colspan and compact ADM-like footer.
          s=s.replace('''colSpan={7}''','''colSpan={6}''',1)
          footer_re=re.compile(r'''   <div className="flex flex-wrap items-center justify-between gap-4 border-t border-\[#dfe4ea\] px-4 py-3 text-xs text-\[#667085\]">.*?</div>\n  </section>''',re.S)
          footer='''   <div className="flex items-center justify-between px-4 py-3 text-xs text-muted-foreground"><span>{rows.length?`${(safePage-1)*pageSize+1}–${Math.min(safePage*pageSize,rows.length)} de ${rows.length}`:"0 documento(s)"}</span><div><button disabled={safePage<=1} onClick={()=>setPage(p=>Math.max(1,p-1))} className="rounded-lg px-3 py-2 disabled:opacity-25">‹</button><span className="px-2">{safePage} / {pages}</span><button disabled={safePage>=pages} onClick={()=>setPage(p=>Math.min(pages,p+1))} className="rounded-lg px-3 py-2 disabled:opacity-25">›</button></div></div>\n  </section>'''
          s,n=footer_re.subn(footer,s,count=1)
          if n!=1: raise SystemExit('footer not found')

          # Summary cards match ADM card geometry; avoid hardcoded white shell.
          s=s.replace('''function Summary({label,value,detail}:{label:string;value:string;detail?:string}){return <div className="rounded-md border border-[#d7dde5] bg-white p-4 shadow-sm">''','''function Summary({label,value,detail}:{label:string;value:string;detail?:string}){return <div className="rounded-2xl bg-muted/10 px-5 py-4">''',1)
          s=s.replace('''text-[#667085]''','''text-muted-foreground''')

          p.write_text(s)
          PY
      - name: Commit SaaS-only redesign and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/redesign-saas-issued-notes.yml
          git add src/components/saas/SaasIssuedNotes.tsx .github/workflows/redesign-saas-issued-notes.yml
          git commit -m "feat(saas): align issued notes with admin structure"
          git push