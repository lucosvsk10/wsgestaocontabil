name: Apply extractor UX polish
on:
  push:
    branches: [fix/extractor-ux-account-and-emitter-theme]
    paths: [.github/workflows/apply-extractor-ux-polish.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extractor-ux-account-and-emitter-theme
      - name: Patch extractor and emitter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/FiscalExtractorApp.tsx')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('missing extractor pattern: '+a[:100])
              s=s.replace(a,b,1)
          rep("import AnimatedExtractorIcon, { type ExtractorIconName } from '@/components/extractor/AnimatedExtractorIcon';\nimport '@/styles/fiscal-extractor.css';", "import AnimatedExtractorIcon, { type ExtractorIconName } from '@/components/extractor/AnimatedExtractorIcon';\nimport ExtractorAccountDrawer from '@/components/extractor/ExtractorAccountDrawer';\nimport '@/styles/fiscal-extractor.css';\nimport '@/styles/fiscal-extractor-polish.css';")
          rep("type Notice={tone:'success'|'warning'|'error';text:string}|null;", "type Notice={tone:'success'|'warning'|'error';text:string}|null;\ntype Usage={used:number;limit:number;remaining:number;percent:number;period_start?:string|null;period_end?:string|null};")
          rep("const [active,setActive]=useState<Section>('Visão geral'),[mobile,setMobile]=useState(false),[snapshot,setSnapshot]=useState<Snapshot|null>(null),[loading,setLoading]=useState(!preview),[denied,setDenied]=useState(false),[notice,setNotice]=useState<Notice>(null),[companyModal,setCompanyModal]=useState(false),[selectedCompanyId,setSelectedCompanyId]=useState<string>(''),[previewDoc,setPreviewDoc]=useState<PreviewDocument|null>(null);", "const [active,setActive]=useState<Section>('Visão geral'),[mobile,setMobile]=useState(false),[snapshot,setSnapshot]=useState<Snapshot|null>(null),[loading,setLoading]=useState(!preview),[denied,setDenied]=useState(false),[notice,setNotice]=useState<Notice>(null),[companyModal,setCompanyModal]=useState(false),[selectedCompanyId,setSelectedCompanyId]=useState<string>(''),[previewDoc,setPreviewDoc]=useState<PreviewDocument|null>(null),[usage,setUsage]=useState<Usage>({used:0,limit:0,remaining:0,percent:0});")
          rep("const load=useCallback(async(quiet=false)=>{if(preview||!user)return;if(!quiet)setLoading(true);const{data,error}=await(supabase as any).rpc('extractor_workspace_snapshot');if(error||!data){setDenied(true)}else{setSnapshot(data as Snapshot);setDenied(false)}if(!quiet)setLoading(false)},[preview,user?.id]);", "const load=useCallback(async(quiet=false)=>{if(preview||!user)return;if(!quiet)setLoading(true);const[snapshotResult,usageResult]=await Promise.all([(supabase as any).rpc('extractor_workspace_snapshot'),(supabase as any).rpc('extractor_account_usage')]);if(snapshotResult.error||!snapshotResult.data){setDenied(true)}else{setSnapshot(snapshotResult.data as Snapshot);setDenied(false);if(usageResult.data)setUsage(usageResult.data as Usage)}if(!quiet)setLoading(false)},[preview,user?.id]);")
          rep("const daily=preview?Array.from({length:30},(_,i)=>({day:iso(new Date(Date.now()-(29-i)*86400000)),documents:[7,9,6,12,8,4,11,13,8,10][i%10]})):(snapshot?.daily||[]).map(x=>({day:String(x.day||''),documents:Number(x.documents||0)}));", "const daily=preview?Array.from({length:30},(_,i)=>({day:iso(new Date(Date.now()-(29-i)*86400000)),documents:[7,9,6,12,8,4,11,13,8,10][i%10]})):(snapshot?.daily||[]).map(x=>({day:String(x.day||''),documents:Number(x.documents||0)}));\n const planUsage:Usage=preview?{used:326,limit:20000,remaining:19674,percent:2,period_start:null,period_end:null}:usage;\n const planLabel=preview?'Escritório · 20.000 XML/mês':snapshot?.account?.plan_code==='office_20000'?'Escritório · 20.000 XML/mês':snapshot?.account?.plan_code||'Plano Extrator';")
          old="<header className=\"extractor-topbar\"><div className=\"extractor-brand\"><button className=\"extractor-mobile-trigger\" onClick={()=>setMobile(true)} aria-label=\"Abrir menu\"><Menu/></button><img src=\"/assets/ws-extrator-fiscal.png\" alt=\"WS Extrator Fiscal\"/></div><div className=\"extractor-workspace\"><small>Carteira fiscal</small><strong>{preview?'Demonstração':snapshot?.account?.name||'WS Gestão Contábil'}</strong></div><div className=\"extractor-account\"><span>{preview?'PR':(user?.email||'WS').slice(0,2).toUpperCase()}</span></div></header>"
          new="<header className=\"extractor-topbar\"><div className=\"extractor-brand\"><button className=\"extractor-mobile-trigger\" onClick={()=>setMobile(true)} aria-label=\"Abrir menu\"><Menu/></button><img src=\"/assets/ws-logo.png\" alt=\"WS Gestão Contábil\"/></div><div className=\"extractor-workspace\"><small>Carteira fiscal</small><strong>{preview?'Demonstração':snapshot?.account?.name||'WS teste'}</strong></div><div className=\"extractor-account\">{preview?<span className=\"extractor-account-avatar\">PR</span>:<ExtractorAccountDrawer planLabel={planLabel} usage={planUsage} companies={companies.length} onOpenSettings={()=>go('Configurações')}/>}</div></header>"
          rep(old,new)
          old="<div className=\"extractor-usage\"><small>Documentos na janela</small><strong>{integer.format(totals.documents)}</strong><span>{snapshot?.account?.monthly_xml_limit?`Plano: ${integer.format(snapshot.account.monthly_xml_limit)} XML`:'Janela fiscal ativa'}</span></div>"
          new="<button className=\"extractor-usage\" onClick={()=>go('Configurações')} data-icon-hover><small>Uso do plano</small><strong>{integer.format(planUsage.used)} <span>/ {integer.format(planUsage.limit)} XML</span></strong><div className=\"usage-track\"><i style={{width:`${Math.min(100,Math.max(0,planUsage.percent))}%`}}/></div><span>{integer.format(planUsage.remaining)} restantes · ver detalhes</span></button>"
          rep(old,new)
          rep("{active==='Configurações'&&<SettingsSection companies={companies} account={snapshot?.account}/>} ", "{active==='Configurações'&&<SettingsSection companies={companies} account={snapshot?.account} usage={planUsage} planLabel={planLabel}/>} ")
          rep("function Metric({label,value,detail,icon}:{label:string;value:string;detail:string;icon:ExtractorIconName}){return <article className=\"extractor-metric\">", "function Metric({label,value,detail,icon}:{label:string;value:string;detail:string;icon:ExtractorIconName}){return <article className=\"extractor-metric\" data-icon-hover>")
          rep("function PanelHead({title,sub,icon}:{title:string;sub:string;icon:ExtractorIconName}){return <header className=\"extractor-panel-head\">", "function PanelHead({title,sub,icon}:{title:string;sub:string;icon:ExtractorIconName}){return <header className=\"extractor-panel-head\" data-icon-hover>")
          rep("<button key={n.label} className={active===n.label?'is-active':''} onClick={()=>go(n.label)}>", "<button key={n.label} data-icon-hover className={active===n.label?'is-active':''} onClick={()=>go(n.label)}>")
          rep("<div className=\"extractor-company-row\" key={c.id}>", "<div className=\"extractor-company-row\" key={c.id} role=\"button\" tabIndex={0} data-icon-hover onClick={()=>onOpen(c.id)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onOpen(c.id)}}}>")
          rep("<button onClick={()=>void sync(c)} disabled={busy===c.id}>", "<button onClick={e=>{e.stopPropagation();void sync(c)}} disabled={busy===c.id}>")
          rep("<button onClick={()=>onOpen(c.id)}>Notas</button>", "<button onClick={e=>{e.stopPropagation();onOpen(c.id)}}>Notas</button>")
          rep("className={`ws-zebra-row ${cancelled(d)?'ws-zebra-cancelled':''}`} onClick={()=>void open(d)}", "className={`ws-zebra-row ${cancelled(d)?'ws-zebra-cancelled':''}`} data-icon-hover onClick={()=>void open(d)}")
          old="function SettingsSection({companies,account}:any){return <div className=\"extractor-page\"><PageHeading title=\"Configurações\" icon=\"settings\" description=\"Parâmetros da carteira contratada.\"/><div className=\"extractor-settings-grid\"><article className=\"extractor-panel\"><PanelHead title=\"Plano e janela fiscal\" sub=\"Configuração atual\" icon=\"settings\"/><dl><div><dt>Plano</dt><dd>{account?.plan_code||'—'}</dd></div><div><dt>Janela padrão</dt><dd>{account?.base_lookback_days?`${account.base_lookback_days} dias`:'—'}</dd></div><div><dt>Limite mensal</dt><dd>{account?.monthly_xml_limit?`${integer.format(account.monthly_xml_limit)} XML`:'—'}</dd></div></dl></article><article className=\"extractor-panel\"><PanelHead title=\"Rotinas por empresa\" sub=\"Estado fiscal atual\" icon=\"refresh\"/><div className=\"extractor-settings-companies\">{companies.map((c:Company)=><div key={c.id}><span><strong>{c.tradeName}</strong><small>{c.automaticSync?'Sincronização automática habilitada':'Sincronização automática desabilitada'}</small></span><span>Compras: {syncLabel(c.purchaseStatus)}<br/>Vendas: {syncLabel(c.salesStatus)}</span></div>)}</div></article></div></div>}"
          new="function SettingsSection({companies,account,usage,planLabel}:any){const upgrade=()=>window.open('https://wa.me/5582999324884?text=Ol%C3%A1%2C%20quero%20fazer%20upgrade%20do%20plano%20do%20Extrator%20Fiscal%20WS.','_blank','noopener,noreferrer');return <div className=\"extractor-page\"><PageHeading title=\"Configurações\" icon=\"settings\" description=\"Plano, consumo e rotinas da carteira do Extrator.\"/><div className=\"extractor-settings-grid\"><article className=\"extractor-panel extractor-plan-card\" data-icon-hover><PanelHead title=\"Uso do plano\" sub=\"Consumo real do ciclo atual\" icon=\"document\"/><div style={{padding:'20px'}}><div className=\"extractor-plan-usage-header\"><div><span>XML processados</span><strong>{integer.format(usage.used)} / {integer.format(usage.limit)}</strong></div><b>{usage.percent}% utilizado</b></div><div className=\"extractor-plan-progress\"><i style={{width:`${Math.min(100,Math.max(0,usage.percent))}%`}}/></div><div className=\"extractor-plan-details\"><div><span>Restantes</span><strong>{integer.format(usage.remaining)} XML</strong></div><div><span>Plano</span><strong>{planLabel}</strong></div><div><span>Ciclo</span><strong>{formatDate(usage.period_start)} a {formatDate(usage.period_end)}</strong></div></div><button className=\"extractor-primary extractor-upgrade\" onClick={upgrade}>Fazer upgrade</button></div></article><article className=\"extractor-panel\" data-icon-hover><PanelHead title=\"Plano e janela fiscal\" sub=\"Configuração atual\" icon=\"settings\"/><dl><div><dt>Plano</dt><dd>{planLabel}</dd></div><div><dt>Janela padrão</dt><dd>{account?.base_lookback_days?`${account.base_lookback_days} dias`:'—'}</dd></div><div><dt>Limite mensal</dt><dd>{usage.limit?`${integer.format(usage.limit)} XML`:'—'}</dd></div></dl></article><article className=\"extractor-panel\" data-icon-hover><PanelHead title=\"Rotinas por empresa\" sub=\"Estado fiscal atual\" icon=\"refresh\"/><div className=\"extractor-settings-companies\">{companies.map((c:Company)=><div key={c.id}><span><strong>{c.tradeName}</strong><small>{c.automaticSync?'Sincronização automática habilitada':'Sincronização automática desabilitada'}</small></span><span>Compras: {syncLabel(c.purchaseStatus)}<br/>Vendas: {syncLabel(c.salesStatus)}</span></div>)}</div></article></div></div>}"
          rep(old,new)
          s=s.replace('src="/assets/ws-extrator-fiscal.png" alt="WS Extrator Fiscal"','src="/assets/ws-logo.png" alt="WS Gestão Contábil"')
          p.write_text(s)

          p=Path('src/pages/SaasApp.tsx'); s=p.read_text()
          a="import '@/styles/saas-mobile-polish.css';"
          b="import '@/styles/saas-mobile-polish.css';\nimport '@/styles/saas-user-polish.css';"
          if a not in s: raise SystemExit('missing saas import pattern')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name "lucosvsk10"
          git config user.email "123520265+lucosvsk10@users.noreply.github.com"
          git add src/pages/FiscalExtractorApp.tsx src/pages/SaasApp.tsx
          git commit -m "feat: finish extractor account UX and emitter visual alignment"
          git push origin HEAD:fix/extractor-ux-account-and-emitter-theme
