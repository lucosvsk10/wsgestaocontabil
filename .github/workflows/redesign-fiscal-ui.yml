name: Apply fiscal UI redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-fiscal-ui.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine emission UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/saas/SaasEmission.tsx')
          s=p.read_text()
          s=s.replace('const panel="rounded-[10px] border border-[#dbe1e8] bg-white p-5 md:p-6";','const panel="saas-fiscal-card rounded-[12px] border border-[#dbe1e8] bg-white p-5 md:p-6";')
          s=s.replace('return <div className="space-y-5 pb-10"><div><button onClick={()=>onChoose(null)} className="mb-4 text-sm font-semibold text-[#58709a]">Voltar</button>','return <div className="saas-emission-page space-y-5 pb-10"><div className="saas-emission-header"><button onClick={()=>onChoose(null)} className="saas-back-link mb-4 text-sm font-semibold text-[#58709a]">Voltar</button>')
          old='function Select({label,value,onChange,children}:{label:string;value:any;onChange:(v:string)=>void;children:any}){return <label className="text-sm font-medium text-[#263652]">{label}<select value={value??""} onChange={e=>onChange(e.target.value)} className="mt-2 h-11 w-full rounded-md border border-[#cbd3dc] bg-white px-3 text-sm text-[#10203e]">{children}</select></label>}'
          new=old+'\nfunction CatalogPicker({label,value,onChange,items,kind}:{label:string;value:string;onChange:(v:string)=>void;items:any[];kind:"product"|"service"}){const [open,setOpen]=useState(false),[q,setQ]=useState("");const chosen=items.find(x=>x.id===value);const filtered=items.filter(x=>String(`${x.name||""} ${x.code||""} ${x.ncm||""} ${x.service_code_national||""}`).toLowerCase().includes(q.toLowerCase())).slice(0,12);return <div className="catalog-picker"><label className="text-sm font-medium text-[#263652]">{label}</label><button type="button" className={`catalog-picker-trigger ${chosen?"has-value":""}`} onClick={()=>setOpen(v=>!v)}><span><strong>{chosen?.name||`Selecionar ${kind==="product"?"produto":"serviço"}`}</strong><small>{chosen?(kind==="product"?[chosen.code,chosen.ncm?`NCM ${chosen.ncm}`:null].filter(Boolean).join(" · "):[chosen.code,chosen.service_code_national?`Código ${chosen.service_code_national}`:null].filter(Boolean).join(" · ")):"Busque por nome, código ou classificação fiscal"}</small></span><span className="catalog-picker-price">{chosen?.sale_price!=null?Number(chosen.sale_price).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):""}</span></button>{open&&<div className="catalog-picker-popover"><Input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={`Buscar ${kind==="product"?"produto":"serviço"}...`} className="catalog-picker-search"/><div className="catalog-picker-list">{filtered.length?filtered.map(x=><button type="button" key={x.id} className="catalog-picker-option" onClick={()=>{onChange(x.id);setOpen(false);setQ("")}}><span><strong>{x.name}</strong><small>{kind==="product"?[x.code,x.ncm?`NCM ${x.ncm}`:null,x.stock_managed?`Estoque ${x.stock_quantity??0}`:null].filter(Boolean).join(" · "):[x.code,x.service_code_national?`Código ${x.service_code_national}`:null].filter(Boolean).join(" · ")}</small></span><b>{x.sale_price!=null?Number(x.sale_price).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"—"}</b></button>):<div className="catalog-picker-empty">Nenhum item encontrado.</div>}</div></div>}</div>}'
          if old not in s: raise SystemExit('Select component marker not found')
          s=s.replace(old,new,1)
          prod='<Select label="Produto" value={form.productId} onChange={v=>set("productId",v)}><option value="">Selecione</option>{products.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</Select>'
          svc='<Select label="Serviço" value={form.serviceId} onChange={v=>set("serviceId",v)}><option value="">Selecione</option>{services.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</Select>'
          s=s.replace(prod,'<CatalogPicker label="Produto" value={form.productId} onChange={v=>set("productId",v)} items={products} kind="product"/>')
          s=s.replace(svc,'<CatalogPicker label="Serviço" value={form.serviceId} onChange={v=>set("serviceId",v)} items={services} kind="service"/>')
          s=s.replace('className={environment==="production"?"saas-action-danger":"saas-action-primary"}','className="saas-action-primary"')
          cte='<div className="flex flex-wrap gap-3"><Button variant="outline" disabled={busy||!backendMatchesTransport} onClick={()=>invoke("saas-cte-issue",{action:"status",data:{environment,cUF:"27"}})}>Testar SEFAZ</Button>{actions("saas-cte-issue",ctePayload(),{},true)}</div>'
          mdfe='<div className="flex flex-wrap gap-3"><Button variant="outline" disabled={busy||!backendMatchesTransport} onClick={()=>invoke("saas-mdfe-issue",{action:"status",data:{environment}})}>Testar SEFAZ</Button>{actions("saas-mdfe-issue",mdfePayload(),{},true)}</div>'
          s=s.replace(cte,'{actions("saas-cte-issue",ctePayload(),{},true)}')
          s=s.replace(mdfe,'{actions("saas-mdfe-issue",mdfePayload(),{},true)}')
          s=s.replace('className="xl:sticky xl:top-[92px] space-y-3"','className="saas-document-preview xl:sticky xl:top-[92px] space-y-3"')
          p.write_text(s)
          PY
      - name: Commit redesign
        run: |
          git config user.name "ws-fiscal-ui"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/saas/SaasEmission.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: redesign fiscal emission workspace"
          git push
