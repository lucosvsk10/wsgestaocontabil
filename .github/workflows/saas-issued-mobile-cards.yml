name: Apply SaaS issued notes mobile polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/saas-issued-mobile-cards.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append CSS
        run: echo '' | base64 -d >> src/styles/saas-mobile-polish.css
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/saas-mobile-polish.css
          git commit -m 'style(saas): refine issued notes mobile cards'
          git push
